apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: deploymentstatuses.qvantel.com
spec:
  group: qvantel.com
  scope: Namespaced
  names:
    # plural name to be used in the URL: /apis/<group>/<version>/<plural>
    plural: deploymentstatuses
    # singular name to be used as an alias on the CLI and for display
    singular: deploymentstatus
    # kind is normally the CamelCased singular type. Your resource manifests use this.
    kind: DeploymentStatus
    # shortNames allow shorter string to match your resource on the CLI
    shortNames:
    - dss
  versions:
    - name: v1
      additionalPrinterColumns:
        - description: The state of the the deployment
          jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - description: Deployed modules count
          jsonPath: .status.deployedModulesCount
          name: Deployed
          type: integer
        - description: Enabled modules count
          jsonPath: .status.enabledModulesCount
          name: Enabled
          type: integer
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: Deployment Status shows information related to Qvantel Deployment
          required:
            - spec
          properties:
            spec:
              type: object
              properties: {}
            status:
              description: The status of the deployment.
              properties:
                conditions:
                  description: List of status conditions.
                  items:
                    properties:
                      lastTransitionTime:
                        description: Last time the condition of a type changed from
                          one status to another. The required format is 'yyyy-MM-ddTHH:mm:ssZ',
                          in the UTC time zone.
                        type: string
                      message:
                        description: Human-readable message indicating details about
                          the condition's last transition.
                        type: string
                      reason:
                        description: The reason for the condition's last transition
                          (a single word in CamelCase).
                        type: string
                      status:
                        description: The status of the condition, either True, False
                          or Unknown.
                        type: string
                      type:
                        description: The unique identifier of a condition, used to distinguish
                          between other conditions in the resource.
                        type: string
                    type: object
                  type: array
                observedGeneration:
                  description: The generation of the CRD that was last reconciled by
                    the operator.
                  type: integer
                enabledModulesCount:
                  description: Count of Enabled Modules.
                  type: integer
                  default: 0
                deployedModulesCount:
                  description: Count of Deployed Modules.
                  type: integer
                  default: 0
              type: object
      # subresources for the custom resource
      subresources:
        # enables the status subresource                
        status: {}