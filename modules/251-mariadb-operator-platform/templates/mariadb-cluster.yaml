{{- if .Values.mariadbOperatorPlatform.clusters }}
{{- range keys .Values.mariadbOperatorPlatform.clusters  }}
{{- $current := get $.Values.mariadbOperatorPlatform.clusters . }}
{{- if $current.enabled }}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: {{ . }}
spec:
  {{- toYaml $current.spec | nindent 2 }}

{{- if $current.vaultConfiguration }}
---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: admin-role-{{ . }}
spec:
  db-name: {{ . }}
  creation-statements: >-
    {{ printf "CREATE USER '{{name}}'@'%%' IDENTIFIED BY '{{password}}'; GRANT GRANT OPTION, SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, RELOAD, PROCESS, REFERENCES, INDEX, ALTER, SHOW DATABASES, CREATE TEMPORARY TABLES, LOCK TABLES, EXECUTE, REPLICATION SLAVE, REPLICATION CLIENT, CREATE VIEW, SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, CREATE USER, EVENT, TRIGGER ON *.* TO '{{name}}'@'%%';" }}

---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: readonly-role-{{ . }}
spec:
  db-name: {{ . }}
  creation-statements: >-
    {{ printf "CREATE USER '{{name}}'@'%%' IDENTIFIED BY '{{password}}'; GRANT SELECT, SHOW DATABASES, SHOW VIEW ON *.* TO '{{name}}'@'%%';" }}

---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: readwrite-role-{{ . }}
spec:
  db-name: {{ . }}
  creation-statements: >-
    {{ printf "CREATE USER '{{name}}'@'%%' IDENTIFIED BY '{{password}}'; GRANT SELECT, SHOW DATABASES, SHOW VIEW, INSERT, UPDATE, DELETE, EXECUTE ON *.* TO '{{name}}'@'%%';" }}

---
apiVersion: platform-vault.qvantel.com/v1
kind: DbConnection
metadata:
  annotations:
    platform.qvantel.com/retry-count: "100"
  name: {{ . }}
spec:
  connection-name: {{ . }}
  plugin-name: mysql-database-plugin
  allowed-roles: '*'
  computed-values:
  - expression: k8s_get_secret_value('{{ . }}-root','{{ $.Release.Namespace }}','password')
    name: secret-password
  {{- if $current.spec.replication.enabled }}
  db-url: >-
    {{ printf "{{username}}:{{password}}@tcp(%s-primary.%s.svc:3306)/" . $.Release.Namespace }}
  {{- else }}
  db-url: >-
    {{ printf "{{username}}:{{password}}@tcp(%s.%s.svc:3306)/" . $.Release.Namespace }}
  {{- end }}
  db-username: 'root'
  db-password: '{secret-password}'
{{- end }}

{{- if and $current.spec (and $current.spec.backup $current.spec.backup.scheduledBackup) }}

---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Backup
metadata:
  name: {{ . }}-scheduled-backups
spec:
  mariaDbRef:
    name: {{ . }}
  serviceAccountName: platform
  maxRetention: {{ $current.spec.backup.retention | default "48h" }}
  storage:
    s3:
      bucket: {{ $current.spec.backup.bucketName }}
      prefix: mariadb
      endpoint: {{ $current.spec.backup.endpoint }}
      region: {{ $current.spec.backup.region }}
      tls:
        enabled: false
  stagingStorage:
    persistentVolumeClaim:
      resources:
        requests:
          storage: {{ $current.spec.backup.stagingStorage | default "10Gi" }}
      accessModes:
        - ReadWriteOnce
  compression: gzip
  schedule:
    cron: {{ $current.spec.backup.scheduledBackup | default "0 0 * * *" }}
    suspend: false
{{- end }}

{{- end }}
{{- end }}
{{- end }}
