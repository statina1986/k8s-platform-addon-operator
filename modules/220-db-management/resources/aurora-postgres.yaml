apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aurorapostgreses.platform-dbs.qvantel.com
spec:
  group: platform-dbs.qvantel.com
  scope: Namespaced
  names:
    # plural name to be used in the URL: /apis/<group>/<version>/<plural>
    plural: aurorapostgreses
    # singular name to be used as an alias on the CLI and for display
    singular: aurorapostgres
    # kind is normally the CamelCased singular type. Your resource manifests use this.
    kind: AuroraPostgres
    # shortNames allow shorter string to match your resource on the CLI
    shortNames:
    - apg
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: Vault Database Role definition
          required:
            - spec
          properties:
            spec:
              type: object
              properties:
                endpoint:
                  type: string
                  description: Database Endpoint address.
                credentials_secret:
                  type: string
                  description: Secret holding initial admin credentials