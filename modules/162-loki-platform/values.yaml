lokiPlatform:
  loki:
    enabled: true
    test:
      enabled: false
    monitoring:
      lokiCanary:
        enabled: false
      selfMonitoring:
        enabled: false
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: 'filesystem'
      schema_config: {}
      rulerConfig: {}
      storage_config:
        hedging:
          at: "250ms"
          max_per_second: 20
          up_to: 3
    serviceAccount:
      create: true
  promtail:
    enabled: false
    config:
      lokiAddress: http://loki-platform.platform.svc:3100/loki/api/v1/push
