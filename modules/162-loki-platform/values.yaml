lokiPlatform:
  loki:
    enabled: true
    test:
      enabled: false
    monitoring:
      lokiCanary:
        enabled: false
      selfMonitoring:
        enabled: false
    loki:
      auth_enabled: false
      limits_config:
        enforce_metric_name: false
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
      commonConfig:
        replication_factor: 1
      storage:
        type: 'filesystem'
      schema_config: {}
      rulerConfig: {}
      storage_config:
        hedging:
          at: "250ms"
          max_per_second: 20
          up_to: 3
      chunk_store_config:
        max_look_back_period: 10s

      table_manager:
        retention_deletes_enabled: false
        retention_period: 336h
      compactor: {}
    tableManager:
      enabled: false
      extraVolumeMounts: []
      extraVolumes: []
    serviceAccount:
      create: true
    read:
      affinity: |
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "loki.readSelectorLabels" . | nindent 10 }}
              topologyKey: kubernetes.io/hostname
    write:
      affinity: |
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "loki.writeSelectorLabels" . | nindent 10 }}
              topologyKey: kubernetes.io/hostname
    gateway:
      replicas: 1
  promtail:
    enabled: false
    config:
      lokiAddress: http://loki-platform.platform.svc:3100/loki/api/v1/push
