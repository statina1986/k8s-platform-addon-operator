apiVersion: v1
kind: ServiceAccount
metadata:
  name: consul
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: consul-token
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: consul
type: kubernetes.io/service-account-token

{{- if eq .Values.globalConfig.QvantelManagedCluster "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: consul
rules:
  - apiGroups: [""]
    verbs:
      - get
      - list
      - watch
    resources:
      - pods
      - namespaces
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: consul
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: consul
subjects:
  - kind: ServiceAccount
    name: consul
    namespace: {{ .Release.Namespace }}
{{- end }} 