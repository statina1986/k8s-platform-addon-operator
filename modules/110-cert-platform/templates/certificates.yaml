{{- if .Values.certPlatform.certificates }}
{{- range keys .Values.certPlatform.certificates  }}
{{- $current := get $.Values.certPlatform.certificates . }}
{{- if $current.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ . }}
spec:
  {{- toYaml $current.spec | nindent 2 }}

{{- end }}
{{- end }}
{{- end }}