{{- if .Values.certPlatform.certificateConf }}
{{- range keys .Values.certPlatform.certificateConf  }}
{{- $current := get $.Values.certPlatform.certificateConf . }}
{{- if $current.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ . }}
  namespace: {{.Release.Namespace}}
spec:
  {{- print "\n" ($current.certificate | toYaml | indent 2) }}

{{- end }}
{{- end }}
{{- end }}