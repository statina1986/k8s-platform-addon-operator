{{- if .Values.certPlatform.clusterIssuers }}
{{- range keys .Values.certPlatform.clusterIssuers  }}
{{- $current := get $.Values.certPlatform.clusterIssuers . }}
{{- if $current.enabled }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ . }}
spec:
  {{- toYaml $current.spec | nindent 2 }}

{{- end }}
{{- end }}
{{- end }}