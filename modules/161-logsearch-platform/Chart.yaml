apiVersion: v2
name: logsearch-platform
version: 0.0.1
dependencies:
  - name: logsearchPlatform
    version: 0.0.1

# Overriding bitnami annotations by setting images-key to 
# platform-images because they are no longer available

annotations:
  images-key: platform-images
  platform-images: |
    - name: elasticsearch
      image: docker.io/bitnamilegacy/elasticsearch:8.17.1-debian-12-r2
    - name: elasticsearch-exporter
      image: docker.io/bitnamilegacy/elasticsearch-exporter:1.8.0-debian-12-r9
    - name: os-shell
      image: platform.artifactory.qvantel.net/platform/platform-k8s-tools-minimal:1.3.3_202509080945_master_90384dcc
    - name: os-shell-sysctl
      image: platform.artifactory.qvantel.net/platform/platform-k8s-tools:1.3.3_202509080945_master_90384dcc
    - name: kibana
      image: docker.io/bitnamilegacy/kibana:8.17.0-debian-12-r0
