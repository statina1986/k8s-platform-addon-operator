{{- $elasticsecret := (randAscii 32 | b64enc) }}
{{- $elasticsecretData := (lookup "v1" "Secret" .Release.Namespace "logsearch-elastic").data }}
{{- if $elasticsecretData }}
{{- $elasticsecret = (index $elasticsecretData "elasticsearch-password" | b64dec) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: logsearch-elastic
type: Opaque
data:
  elastic-user: {{ "elastic" | b64enc }}
  elasticsearch-password: {{ $elasticsecret | b64enc }}
---
{{- if .Values.logsearchPlatform.elasticsearch.global.kibanaEnabled }}
{{- $kibanasecret := (randAscii 32 | b64enc) }}
{{- $kibanasecretData := (lookup "v1" "Secret" .Release.Namespace "logsearch-kibana-system").data }}
{{- if $kibanasecretData }}
{{- $kibanasecret = (index $kibanasecretData "kibana-password" | b64dec) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: logsearch-kibana-system
type: Opaque
data:
  kibana-user: {{ "kibana_system" | b64enc }}
  kibana-password: {{ $kibanasecret | b64enc }}
---
{{- $kibanareadonlysecret := (randAscii 32 | b64enc) }}
{{- $readonlysecretData := (lookup "v1" "Secret" .Release.Namespace "kibana-readonly-user").data }}
{{- if $readonlysecretData }}
{{- $kibanareadonlysecret = (index $readonlysecretData "password" | b64dec) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kibana-readonly-user
type: Opaque
data:
  username: {{ "readonly" | b64enc }}
  password: {{ $kibanareadonlysecret | b64enc }}
{{- end }}