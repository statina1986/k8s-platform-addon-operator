apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{.Release.Name}}-kubernetes-storage.rules
  namespace: {{.Release.Namespace}}
  generation: 1
  labels:
    app: kube-prometheus-stack
    release: {{.Release.Name}}
spec:
  groups:
  - name: kubernetes-storage
    rules:
    - alert: KubePersistentVolumeFillingUp
      annotations:
        brief: The PersistentVolume claimed by {{`{{`}} $labels.persistentvolumeclaim {{`}}`}} in Namespace {{`{{`}} $labels.namespace {{`}}`}} is only {{`{{`}} $value | humanizePercentage {{`}}`}} free.
        procedure: Escalate to L2 team ASAP after verifying.
      expr: |-
        (
          kubelet_volume_stats_available_bytes{job="kubelet",metrics_path="/metrics"}
            /
          kubelet_volume_stats_capacity_bytes{job="kubelet",metrics_path="/metrics"}
        ) < 0.10
      for: 1m
      labels:
        severity: critical
    - alert: KubePersistentVolumeFillingUp
      annotations:
        brief: The PersistentVolume claimed by {{`{{`}} $labels.persistentvolumeclaim {{`}}`}} in Namespace {{`{{`}} $labels.namespace {{`}}`}} is only {{`{{`}} $value | humanizePercentage {{`}}`}} free.
        procedure: Escalate to L2 team after verifying during business hours.
      expr: |-
        (
          kubelet_volume_stats_available_bytes{job="kubelet",metrics_path="/metrics"}
            /
          kubelet_volume_stats_capacity_bytes{job="kubelet",metrics_path="/metrics"}
        ) < 0.25
      for: 5m
      labels:
        severity: warning
    - alert: KubePersistentVolumeInodesFillingUp
      annotations:
        brief: The PersistentVolume claimed by {{`{{`}} $labels.persistentvolumeclaim {{`}}`}} in Namespace {{`{{`}} $labels.namespace {{`}}`}} only has {{`{{`}} $value | humanizePercentage {{`}}`}} free inodes.
        procedure: Escalate to L2 team ASAP after verifying.
      expr: |-
        (
          kubelet_volume_stats_inodes_free{job="kubelet",metrics_path="/metrics"}
            /
          kubelet_volume_stats_inodes{job="kubelet",metrics_path="/metrics"}
        ) < 0.10
      for: 1m
      labels:
        severity: critical
    - alert: KubePersistentVolumeInodesFillingUp
      annotations:
        brief: The PersistentVolume claimed by {{`{{`}} $labels.persistentvolumeclaim {{`}}`}} in Namespace {{`{{`}} $labels.namespace {{`}}`}} only has {{`{{`}} $value | humanizePercentage {{`}}`}} free inodes.
        procedure: Escalate to L2 team after verifying during business hours.
      expr: |-
        (
          kubelet_volume_stats_inodes_free{job="kubelet",metrics_path="/metrics"}
            /
          kubelet_volume_stats_inodes{job="kubelet",metrics_path="/metrics"}
        ) < 0.25
      for: 1h
      labels:
        severity: warning