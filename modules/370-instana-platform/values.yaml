instanaPlatform:
  instana-agent:
    enabled: true
    global:
      imageRegistry: "platform-artifactory.qvantel.net"
      imagePullSecrets: []
      storageClass: ""
    agent:
      image:
        name: platform-artifactory.qvantel.net/agent/static
      keysSecret: instana-agent-key
      endpointHost: ingress-green-saas.instana.io
      endpointPort: 443
      env:
        INSTANA_AGENT_MODE: to-be-set
        INSTANA_AGENT_TAGS: to-be-set
      pod:
        requests:
          cpu: 0.5
          memory: 512
        limits:
          memory: 768
      configuration_yaml: |
        com.instana.plugin.profiling.java:
          enabled: true
        com.instana.plugin.opentelemetry:
          grpc:
            enabled: true
          http:
            enabled: true
        com.instana.ignore:
          processes:
            - 'stunnel'
          arguments:
            - 'io.strimzi.operator.cluster.Main'
            - 'kafka.Kafka'
            - 'org.apache.zookeeper.server.quorum.QuorumPeerMain'
            - 'io.strimzi.operator.topic.Main'
            - 'io.strimzi.operator.user.Main'
    opentelemetry:
      grpc:
        enabled: true
      http:
        enabled: true
    cluster:
      name: to-be-set
    zone:
      name: to-be-set
  leaderElector:
    image:
      name: platform-artifactory.qvantel.net/instana/leader-elector
  k8s_sensor:
    image:
      name: platform-artifactory.qvantel.net/instana/k8sensor