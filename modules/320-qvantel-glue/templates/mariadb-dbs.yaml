{{- if .Values.qvantelGlue.dbs.mariadb }}
{{- $root := . }}
{{- range keys .Values.qvantelGlue.dbs.mariadb  }}
{{- $current := get $.Values.qvantelGlue.dbs.mariadb . }}
{{- $current_name := . }}

{{- if and $current.cluster $current.cluster.spec }}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: {{ . }}
spec:
  {{- toYaml $current.cluster.spec | nindent 2 }}

{{- if $current.cluster.vaultConfiguration }}
---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: {{ . }}-admin-role
spec:
  db-name: {{ . }}
  creation-statements: >-
    {{ printf "CREATE USER '{{name}}'@'%%' IDENTIFIED BY '{{password}}'; GRANT GRANT OPTION, SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, RELOAD, PROCESS, REFERENCES, INDEX, ALTER, SHOW DATABASES, CREATE TEMPORARY TABLES, LOCK TABLES, EXECUTE, REPLICATION SLAVE, REPLICATION CLIENT, CREATE VIEW, SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, CREATE USER, EVENT, TRIGGER ON *.* TO '{{name}}'@'%%';" }}

---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: {{ . }}-readonly-role
spec:
  db-name: {{ . }}
  creation-statements: >-
    {{ printf "CREATE USER '{{name}}'@'%%' IDENTIFIED BY '{{password}}'; GRANT SELECT, SHOW DATABASES, SHOW VIEW ON *.* TO '{{name}}'@'%%';" }}

---
apiVersion: platform-vault.qvantel.com/v1
kind: DbConnection
metadata:
  annotations:
    platform.qvantel.com/retry-count: "100"
  name: {{ . }}
spec:
  connection-name: {{ . }}
  plugin-name: mysql-database-plugin
  allowed-roles: '*'
  computed-values:
  - expression: k8s_get_secret_value('{{ . }}-root','{{ $.Release.Namespace }}','password')
    name: secret-password
  {{- if and $current.cluster.spec.replication $current.cluster.spec.replication.enabled }}
  db-url: >-
    {{ printf "{{username}}:{{password}}@tcp(%s-primary.%s.svc:3306)/" . $.Release.Namespace}}
  {{- else }}
  db-url: >-
    {{ printf "{{username}}:{{password}}@tcp(%s.%s.svc:3306)/" . $.Release.Namespace}}
  {{- end }}
  db-username: 'root'
  db-password: '{secret-password}'
{{- end }}

{{- end }}


{{- if $current.dbs }}
{{- range keys $current.dbs  }}
{{- $db := get $current.dbs . }}
{{- $db_name := ( . | replace "-" "_") }}
---
apiVersion: platform.qvantel.com/v1
kind: SqlInstaller
metadata:
  annotations:
    platform.qvantel.com/retry-count: "100"
  name: mariadb-{{ . }}-installer
spec:
  type: mariadb
  {{- if and $db.sql $db.sql.provision }}
  db-provision-sql:
    {{- tpl (toYaml $db.sql.provision) $root | nindent 2 }}
  {{- else }}
  db-provision-sql:
    - "CREATE DATABASE IF NOT EXISTS {{ $db_name }} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
  {{ end }}  
  db-username: 'root'
  db-password: "{mariadb-password}"
  {{- if and $current.cluster.spec.replication $current.cluster.spec.replication.enabled }}
  db-url: {{ $current_name }}-primary.{{ $.Release.Namespace }}.svc
  {{- else }}
  db-url: {{ $current_name }}.{{ $.Release.Namespace }}.svc
  {{- end }}  
  computed-values:
    - name: "mariadb-password"
      expression: "k8s_get_secret_value('{{ $current_name }}-root', '{{ $.Release.Namespace }}', 'password')"

{{- if $db.roles }}
{{- range keys $db.roles  }}
{{- $dbrole := get $db.roles . }}
---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: {{ $dbrole }}
spec:
  creation-statements: {{ $dbrole.sql }} 
  db-name: {{ $current_name }}
  default-ttl: "0"
  max-ttl: "0"
  role-name: {{ $dbrole }}

{{- end }}
{{- else }}

---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: mariadb-{{ . }}
spec:
  creation-statements: >-
    {{ printf "CREATE USER '{{name}}'@'%%' IDENTIFIED BY '{{password}}'; GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, INDEX, ALTER, CREATE TEMPORARY TABLES, LOCK TABLES, EXECUTE, REFERENCES, CREATE VIEW, CREATE ROUTINE, SHOW VIEW ON %s.* TO '{{name}}'@'%%';" $db_name }}
  db-name: {{ $current_name }}
  default-ttl: "0"
  max-ttl: "0"
  role-name: mariadb_{{ . }}

{{- end }}


{{- end }}
{{- end }}


{{- if $current.roles }}
{{- range keys $current.roles  }}
{{- $dbrole := get $current.roles . }}
---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: {{ $dbrole }}
spec:  
  creation-statements: {{ $dbrole.sql }}
  db-name: {{ $current_name }}
  default-ttl: "0"
  max-ttl: "0"
  role-name: {{ $dbrole }}

{{- end }}
{{- end }}


{{- end }}
{{- end }}
