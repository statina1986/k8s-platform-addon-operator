{{- if $db.roles }}
{{- range keys $db.roles  }}
{{- $dbrole := get $db.roles . }}
---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: {{ $dbrole }}
spec:
  creation-statements: {{ $dbrole.sql }}
  db-name: cassandra-{{ $current_name }}
  default-ttl: "0"
  max-ttl: "0"
  role-name: {{ $dbrole }}

{{- end }}
{{- else }}


---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: cassandra-{{ . }}
spec:
  db-name: cassandra-{{ $current_name }}
  creation-statements: >-
    {{ printf "CREATE USER '{{username}}' WITH PASSWORD '{{password}}' NOSUPERUSER; GRANT ALL PERMISSIONS ON ALL KEYSPACES TO {{username}};" }}
  role-name: cassandra_{{ . }}

{{- end }}


{{- end }}
