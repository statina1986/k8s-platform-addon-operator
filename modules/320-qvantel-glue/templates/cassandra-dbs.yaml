{{- if .Values.qvantelGlue.dbs.cassandra }}
{{- $root := . }}
{{- range keys .Values.qvantelGlue.dbs.cassandra  }}
{{- $current := get $.Values.qvantelGlue.dbs.cassandra . }}
{{- $current_name := . }}

{{- if $current.cluster }}

{{- if $current.cluster.spec }}

---
apiVersion: k8ssandra.io/v1alpha1
kind: K8ssandraCluster
metadata:
  name: {{ . }}
spec:
  {{- toYaml $current.cluster.spec | nindent 2 }}

{{- end }}

{{- if $current.cluster.vaultConfiguration }}

---
apiVersion: platform-vault.qvantel.com/v1
kind: DbConnection
metadata:
  name: cassandra-{{ . }}
spec:
  connection-name: cassandra-{{ . }}
  plugin-name: cassandra-database-plugin
  allowed-roles: '*'  
  additional-params:
    hosts: main-cassandra-service.{{ $.Release.Namespace }}.svc
    protocol_version: "4"
    username_template: >-
      {{ printf "{{ printf \"v_%%s_%%s_%%s_%%s\" (.DisplayName | truncate 15) (.RoleName | truncate 15) (random 20) (unix_time) | truncate 100 | replace \"-\" \"_\" |replace \".\" \"_\" | lowercase }}" }}
  computed-values:
  - expression: k8s_get_secret_value('{{ . }}-superuser','{{ $.Release.Namespace }}','username')
    name: secret-username
  - expression: k8s_get_secret_value('{{ . }}-superuser','{{ $.Release.Namespace }}','password')
    name: secret-password
  db-username: '{secret-username}'
  db-password: '{secret-password}'

---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: admin-role-cassandra-{{ . }}
spec:
  db-name: cassandra-{{ . }}
  creation-statements: >-
    {{ printf "CREATE USER '{{username}}' WITH PASSWORD '{{password}}' NOSUPERUSER; GRANT ALL PERMISSIONS ON ALL KEYSPACES TO {{username}};" }}

---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: readonly-role-cassandra-{{ . }}
spec:
  db-name: cassandra-{{ . }}
  creation-statements: >-
    {{ printf "CREATE ROLE {{username}} WITH PASSWORD = '{{password}}' AND LOGIN = true AND SUPERUSER = false; GRANT SELECT ON ALL KEYSPACES TO {{username}};" }}

---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: readwrite-role-cassandra-{{ . }}
spec:
  db-name: cassandra-{{ . }}
  creation-statements: >-
    {{ printf "CREATE ROLE {{username}} WITH PASSWORD = '{{password}}' AND LOGIN = true AND SUPERUSER = false; GRANT SELECT ON ALL KEYSPACES TO {{username}}; GRANT MODIFY ON ALL KEYSPACES TO {{username}};" }}


{{- end }}

{{- end }}


{{- if $current.dbs }}
{{- range keys $current.dbs  }}
{{- $db := get $current.dbs . }}
{{- $db_name := . }}
{{- $db_name_underscore := ( . | replace "-" "_") }}
{{- $db_rf := ( $db.replicationFactors | default "{'class':'NetworkTopologyStrategy', 'dc1': 1}") }}

---
apiVersion: platform.qvantel.com/v1
kind: CqlInstaller
metadata:
  annotations:
    platform.qvantel.com/retry-count: "100"
  name: cassandra-{{ $db_name }}-installer
spec:  
  {{- if and $db.cql $db.cql.provision }}
  db-provision-cql:
    {{- tpl (toYaml $db.cql.provision) $root | nindent 2 }}
  {{- else }}
  db-provision-cql:
    - "CREATE KEYSPACE IF NOT EXISTS {{ $db_name_underscore }} WITH replication = {{ $db_rf }} AND durable_writes = true;"
    - "ALTER KEYSPACE {{ $db_name_underscore }} WITH replication = {{ $db_rf }} AND durable_writes = true;"
  {{ end }}
  {{- if and $db.cql $db.cql.additional }}
  additional-cql:
    {{- tpl (toYaml $db.cql.additional) $root | nindent 2 }}
  {{ end }}
  db-username: "{cass-user}"
  db-password: "{cass-password}"
  db-url: "main-cassandra-service-0-headless.{{ $.Release.Namespace }}.svc"
  computed-values:
    - name: "cass-password"
      expression: "k8s_get_secret_value('{{ $current_name }}-superuser', '{{ $.Release.Namespace }}', 'password')"
    - name: "cass-user"
      expression: "k8s_get_secret_value('{{ $current_name }}-superuser', '{{ $.Release.Namespace }}', 'username')"

{{- if $db.roles }}
{{- range keys $db.roles  }}
{{- $dbrole := get $db.roles . }}
---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: {{ $dbrole }}
spec:
  creation-statements: {{ $dbrole.cql }}
  db-name: cassandra-{{ $current_name }}
  default-ttl: "0"
  max-ttl: "0"
  role-name: {{ $dbrole }}

{{- end }}
{{- else }}


---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: cassandra-{{ $db_name }}-{{ $root.Values.global.appsNamespace }}
spec:
  db-name: cassandra-{{ $current_name }}
  creation-statements: >-
    {{ printf "CREATE USER '{{username}}' WITH PASSWORD '{{password}}' NOSUPERUSER; GRANT ALL PERMISSIONS ON KEYSPACE %s TO {{username}};" $db_name_underscore }}
  role-name: {{ $root.Values.global.appsNamespace }}-{{ $db_name }}-cassandra

{{- end }}


{{- end }}
{{- end }}


{{- if $current.roles }}
{{- range keys $current.roles  }}
{{- $dbrole := get $current.roles . }}
{{- $dbRoleName := . }}
---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: {{ $dbRoleName }}
spec:  
  creation-statements: {{ $dbrole.cql }}
  db-name: cassandra-{{ $current_name }}
  default-ttl: "0"
  max-ttl: "0"
  role-name: {{ $dbRoleName }}

{{- end }}
{{- end }}

{{- if $current.cqls }}
{{- range keys $current.cqls  }}
{{- $cql := get $current.cqls . }}
---
apiVersion: platform.qvantel.com/v1
kind: CqlInstaller
metadata:
  annotations:
    platform.qvantel.com/retry-count: "100"
  name: cassandra-{{ $current_name }}-{{ . }}
spec:    
  db-provision-cql:
    {{- tpl (toYaml $cql.cql) $root | nindent 2 }}   
  db-username: "{cass-user}"
  db-password: "{cass-password}"
  db-url: "main-cassandra-service-0-headless.{{ $.Release.Namespace }}.svc"
  computed-values:
    - name: "cass-password"
      expression: "k8s_get_secret_value('{{ $current_name }}-superuser', '{{ $.Release.Namespace }}', 'password')"
    - name: "cass-user"
      expression: "k8s_get_secret_value('{{ $current_name }}-superuser', '{{ $.Release.Namespace }}', 'username')"
{{- end }}
{{- end }}


{{- end }}
{{- end }}
