{{- if $current.roles }}
{{- range keys $current.roles  }}
{{- $dbrole := get $current.roles . }}
---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: {{ $dbrole }}
spec:  
  creation-statements: {{ $dbrole.sql }}
  db-name: cassandra-{{ $current_name }}
  default-ttl: "0"
  max-ttl: "0"
  role-name: {{ $dbrole }}

{{- end }}
{{- end }}


