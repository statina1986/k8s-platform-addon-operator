apiVersion: v2
name: opentelemetry-platform
version: 0.0.1
dependencies:
  - name: opentelemetryPlatform
    version: 0.0.1
annotations:
  images: |
    - name: kubeRBACProxy
      image: quay.io/brancz/kube-rbac-proxy:v0.19.1
    - name: otel-operator
      image: ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator:v0.93.0
    - name: otel-collector
      image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s:0.131.1
    - name: java-auto-instrumentation
      image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.18.1
    - name: python-auto-instrumentation
      image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.57b0
    - name: nodejs-auto-instrumentation
      image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.62.0
    - name: dotnet-auto-instrumentation
      image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:1.12.0
    - name: apache-httpd-auto-instrumentation
      image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-apache-httpd:1.0.4