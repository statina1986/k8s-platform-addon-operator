artifactoryPlatform:
  artifactory-oss:    
    enabled: false    
    artifactory:
      fullnameOverride: artifactory-oss
      artifactory:
        admin:
          secret: artifactory-oss-admin-secret
          dataKey: bootstrap.creds
      nginx:
        enabled: false
      postgresql:
        enabled: false
      database:
        type: postgresql
        driver: org.postgresql.Driver
        url: "jdbc:postgresql://qvt-postgredb.platform.svc.cluster.local.:5432/artifactory-oss"
        secrets:
          user:
            name: "qvt-postgredb-artifactory-oss"
            key: "username"
          password:
            name: "qvt-postgredb-artifactory-oss"
            key: "password"
          url:
            name: "qvt-postgredb-artifactory-oss"
            key: "db-url"
  artifactory-jcr:
    enabled: false
    artifactory:
      fullnameOverride: artifactory-jcr
      artifactory:
        admin:
          secret: artifactory-jcr-admin-secret
          dataKey: bootstrap.creds
      nginx:
        enabled: false
      postgresql:
        enabled: false
      database:
        type: postgresql
        driver: org.postgresql.Driver
        url: "jdbc:postgresql://qvt-postgredb.platform.svc.cluster.local.:5432/artifactory-jcr"
        secrets:
          user:
            name: "qvt-postgredb-artifactory-jcr"
            key: "username"
          password:
            name: "qvt-postgredb-artifactory-jcr"
            key: "password"
          url:
            name: "qvt-postgredb-artifactory-jcr"
            key: "db-url"
  databaseOSS:
    enabled: true
    name: qvt-postgredb
  databaseJCR:
    enabled: true
    name: qvt-postgredb
