{{- template "elasticsearchPlatform.logsearchEnabled" . -}}
{{- if .logsearchEnabled -}}
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: logsearch
  namespace: {{.Release.Namespace}}
  annotations:
    eck.k8s.elastic.co/downward-node-labels: "topology.kubernetes.io/zone"
spec:
  {{- range .Values.elasticsearchPlatform.configElastic }}
    {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- template "elasticsearchPlatform.logsearchBackupEnabled" . -}}
{{- if .logsearchBackupEnabled -}}
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: logsearch
  namespace: {{.Release.Namespace}}
  annotations:
    eck.k8s.elastic.co/downward-node-labels: "topology.kubernetes.io/zone"
spec:
  {{- range .Values.elasticsearchPlatform.configElasticBackup }}
    {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}