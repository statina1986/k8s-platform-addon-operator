apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  annotations:
    helm.sh/hook: post-install,post-upgrade,pre-delete
    helm.sh/hook-weight: "5"
  name: kibana
  namespace: platform
spec:
  {{- range .Values.elasticsearchPlatform.configKibana }}
    {{- toYaml . | nindent 2 }}
  {{- end }}