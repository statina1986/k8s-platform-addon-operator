apiVersion: v2
name: elasticsearch-platform
version: 0.0.1
dependencies:
  - name: elasticsearchPlatform
    version: 0.0.1
annotations:
  images: |
    - name: elasticsearch
      image: docker.io/elasticsearch:7.16.2
    - name: kibana
      image: docker.io/kibana:7.16.2
    - name: eck-operator
      image: docker.io/elastic/eck-operator:2.2.0
    - name: filebeat
      image: docker.io/elastic/filebeat:7.16.2
    - name: logstash
      image: docker.io/logstash:7.16.2
