apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:  
  name: istio-public-ingress-telemetry
  namespace: platform
spec:
  selector:
    matchLabels:
      istio: public-ingress
  accessLogging:
  - providers:
    - name: ingress-access-log

---
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:  
  name: istio-private-ingress-telemetry
  namespace: platform
spec:
  selector:
    matchLabels:
      istio: private-ingress
  accessLogging:
  - providers:
    - name: ingress-access-log

---
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:  
  name: istio-integrations-http-ingress-telemetry
  namespace: platform
spec:
  selector:
    matchLabels:
      istio: integrations-http-ingress
  accessLogging:
  - providers:
    - name: ingress-access-log