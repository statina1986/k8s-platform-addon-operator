monitoringPlatform:
  qvantelMonitoring:
  #Customer variable to control alerts and dashboards deployed per Program
    programs:
      lyle: false
      sayco: false
      windtre: false
  #Variable to control applications deployed in the environment
    applications:
      commonOnePointZero: false
      commonZeroPointSix: false
      bssapi: false
      flex: false
      ordersManager: false
  #Modules variables to control alerts and dashboards deployed based on the modules already deployed
    modules:
      kafka: false
      kasope: false
      consul: false
      vault: false
      istio: false
      elasticsearch: false
      postgres: false
      mariadb: false
      redis: false
      rabbitmq: false
      mongo: false
#INSTANA disabled by default as we need a cloud backend to actually connect it to.
  instana-agent:
    enabled: false
    agent:
      key: to-be-filled
      endpointHost: to-be-filled-ingress-address
      endpointPort: 443
      env:
        INSTANA_AGENT_MODE: to-be-filled APM/INFRASTRUCTURE
        INSTANA_AGENT_TAGS: to-be-filled
      pod:
        requests:
          cpu: 0.5
          memory: 512
        limits:
          cpu: 2
          memory: 768
      configuration_yaml: |
        com.instana.plugin.profiling.java:
          enabled: true
        com.instana.plugin.opentelemetry:
          enabled: true
        com.instana.ignore:
          processes:
            - 'stunnel'
          arguments:
            - 'io.strimzi.operator.cluster.Main'
            - 'kafka.Kafka'
            - 'org.apache.zookeeper.server.quorum.QuorumPeerMain'
            - 'io.strimzi.operator.topic.Main'
            - 'io.strimzi.operator.user.Main'
    cluster:
      name: to-be-filled
    zone:
      name: to-be-filled
  prometheus-blackbox-exporter:
    enabled: true
  prometheus-consul-exporter:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      telemetryPath: /metrics
  kube-prometheus-stack:
    enabled: true
    grafana:
      enabled: true
      persistence:
        type: pvc
        enabled: true
        size: 30Gi
        finalizers:
          - kubernetes.io/pvc-protection      
      image:
        # we use enterprise license which is free-to-use to avoid AGPL3 in grafana-oss
        repository: grafana/grafana-enterprise
      adminPassword: Q4nt3l321
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
          - name: Loki
            type: loki
            url: http://loki-platform.platform.svc:3100
      plugins:
        - grafana-piechart-panel
        - yesoreyeram-infinity-datasource
      grafana.ini:
        auth.anonymous:
          enabled: true
          org_role: Viewer
      sidecar:
        datasources:
          enabled: true
          defaultDatasourceEnabled: true
          maxLines: 1000
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          folder: /tmp/dashboards
          provider:
          # enabling UI dashboards updated
            allowUiUpdates: true
          # enabling to structure dashboards folder based on the k8s-sidecar-target-directory
            foldersFromFilesStructure: true
    prometheus:
      enabled: true
      prometheusSpec:
        retention: 12d
        externalLabels:
          country: need-to-define
          customer: need-to-define
          datacenter: need-to-define
          environment: need-to-define
        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 50Gi
        additionalAlertManagerConfigs:
          - static_configs:
            - targets:
              - "alertmanager.alert.k8s.qvantel.net:9096"
        additionalScrapeConfigs: |
          - job_name: 'kubernetes-pods'
            kubernetes_sd_configs:
            - role: pod
            relabel_configs:  # If first two labels are present, pod should be scraped  by the istio-secure job.
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            # Keep target if there's no sidecar or if prometheus.io/scheme is explicitly set to "http"
            - source_labels: [__meta_kubernetes_pod_annotation_sidecar_istio_io_status, __meta_kubernetes_pod_annotation_prometheus_io_scheme]
              action: keep
              regex: ((;.*)|(.*;http))
            - source_labels: [__meta_kubernetes_pod_annotation_istio_mtls]
              action: drop
              regex: (true)
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod_name
            - source_labels: [__meta_consul_node]
              separator: ;
              regex: (.*)
              target_label: node
              replacement: $1
              action: replace
          - job_name: "kafka"
            scrape_interval: 30s
            scrape_timeout:  20s
            metrics_path: /metrics
            consul_sd_configs:
              - server: consul.service.consul:8500
                services:
                  - 'kafka'
            relabel_configs:
            - source_labels: [__address__]
              action: replace
              regex: ([^:]+):.*
              replacement: $1:9404
              target_label: __address__