{{- if $.Values.monitoringPlatform.qvantelMonitoring.programs.mmlyle }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: monitoring-platform-kube-p-kafka-mmlyle.rules
  namespace: {{.Release.Namespace}}
  generation: 1
  annotations:
    meta.helm.sh/release-name: monitoring-platform
    meta.helm.sh/release-namespace: {{.Release.Namespace}}
  labels:
    app: kube-prometheus-stack
    release: monitoring-platform
spec:
  groups:
  - name: kafka_mmlyle.alerts
    rules:
    - alert: KafkaAbsentConsumerConnectionCDREventReceiverLebara
      annotations:
        brief: Absent of Kafka consumer connection in cdr-event-receiver-lebara application
        procedure: Follow QOPS-8470 and raise to platform team (on-call if needed)
      expr: absent(kafka_consumer_connections{app="cdr-event-receiver-lebara"})
      for: 5m
      labels:
        severity: critical
        level: application
        package: base
    - alert: KafkaAbsentConsumerConnectionCDREventReceiverLyca
      annotations:
        brief: Absent of Kafka consumer connection in cdr-event-receiver-lyca application
        procedure: Follow QOPS-8470 and raise to platform team (on-call if needed)
      expr: absent(kafka_consumer_connections{app="cdr-event-receiver-lyca"})
      for: 5m
      labels:
        severity: critical
        level: application
        package: base
    - alert: KafkaAbsentConsumerConnectionCDRBSSEventReceiver
      annotations:
        brief: Absent of Kafka consumer connection in cdr-bss-event-receiver application
        procedure: Follow QOPS-8470 and raise to platform team (on-call if needed)
      expr: absent(kafka_consumer_connections{app="cdr-bss-event-receiver"})
      for: 5m
      labels:
        severity: critical
        level: application
        package: base
    - alert: KafkaAbsentConsumerConnectionCDRREEventReceiver
      annotations:
        brief: Absent of Kafka consumer connection in cdr-re-event-receiver application
        procedure: Follow QOPS-8470 and raise to platform team (on-call if needed)
      expr: absent(kafka_consumer_connections{app="cdr-re-event-receiver"})
      for: 5m
      labels:
        severity: critical
        level: application
        package: base
{{- end }}