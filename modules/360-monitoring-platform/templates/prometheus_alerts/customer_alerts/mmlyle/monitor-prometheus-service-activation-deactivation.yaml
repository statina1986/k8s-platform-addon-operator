{{- if $.Values.monitoringPlatform.qvantelMonitoring.programs.mmlyle }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: monitor-prometheus-service-activation-deactivation.rules
  namespace: {{.Release.Namespace}}
  generation: 1
  annotations:
    meta.helm.sh/release-name: monitoring-platform
    meta.helm.sh/release-namespace: {{.Release.Namespace}}
  labels:
    app: kube-prometheus-stack
    release: monitoring-platform
spec:
  groups:
    - name: service-activation-deactivation.alerts
      rules:
      - alert: GeneralAdditionalServicesOperationsErrors
        expr: (((sum by (definition) (increase(flex_bpmn_activity_error_received_total{app!="",definition=~"PO_.+BoltOn|PO_.+GB.+|PO_Africa.+|PO_ALL_IN_ONE.+|PO_Anticipo.+|PO_Argelia.+|PO_Argentina.+|PO_Bolivia.+|PO_Bolt_On.+|PO_Bono.+|PO_BONO.+|PO_Cuba.+|PO_DAILY.+|PO_Data_Unlimited.+|PO_Datos.+|PO_Ecuador.+|PO_Filipinas.+|PO_FLEXI.+|PO_Ilimitado.+|PO_Latino.+|PO_Lebara_200KB.+|PO_Lyca.+|PO_Mali.+|PO_MAROC.+|PO_Marruecos.+|PO_Mundo.+|PO_Navega.+|PO_Nigeria.+|PO_Pakistan.+|PO_PLAN_TODO.+|PO_Recarga.+|PO_Rep_Dominicana.+|PO_Rusia.+|PO_Senegal.+|PO_SIMO.+|PO_TARIFA.+|PO_TEST.+|PO_TODO_INCLUIDO.+|PO_Ucrania.+|PO_Venezuela.+"}[10m]) OR vector(0)))) / ((((sum by (definition) (increase(flex_bpmn_process_completed_total{app!="",definition=~"PO_.+BoltOn|PO_.+GB.+|PO_Africa.+|PO_ALL_IN_ONE.+|PO_Anticipo.+|PO_Argelia.+|PO_Argentina.+|PO_Bolivia.+|PO_Bolt_On.+|PO_Bono.+|PO_BONO.+|PO_Cuba.+|PO_DAILY.+|PO_Data_Unlimited.+|PO_Datos.+|PO_Ecuador.+|PO_Filipinas.+|PO_FLEXI.+|PO_Ilimitado.+|PO_Latino.+|PO_Lebara_200KB.+|PO_Lyca.+|PO_Mali.+|PO_MAROC.+|PO_Marruecos.+|PO_Mundo.+|PO_Navega.+|PO_Nigeria.+|PO_Pakistan.+|PO_PLAN_TODO.+|PO_Recarga.+|PO_Rep_Dominicana.+|PO_Rusia.+|PO_Senegal.+|PO_SIMO.+|PO_TARIFA.+|PO_TEST.+|PO_TODO_INCLUIDO.+|PO_Ucrania.+|PO_Venezuela.+"}[10m]) OR vector(0))))) + ((sum by (definition) (increase(flex_bpmn_activity_error_received_total{app!="",definition=~"PO_.+BoltOn|PO_.+GB.+|PO_Africa.+|PO_ALL_IN_ONE.+|PO_Anticipo.+|PO_Argelia.+|PO_Argentina.+|PO_Bolivia.+|PO_Bolt_On.+|PO_Bono.+|PO_BONO.+|PO_Cuba.+|PO_DAILY.+|PO_Data_Unlimited.+|PO_Datos.+|PO_Ecuador.+|PO_Filipinas.+|PO_FLEXI.+|PO_Ilimitado.+|PO_Latino.+|PO_Lebara_200KB.+|PO_Lyca.+|PO_Mali.+|PO_MAROC.+|PO_Marruecos.+|PO_Mundo.+|PO_Navega.+|PO_Nigeria.+|PO_Pakistan.+|PO_PLAN_TODO.+|PO_Recarga.+|PO_Rep_Dominicana.+|PO_Rusia.+|PO_Senegal.+|PO_SIMO.+|PO_TARIFA.+|PO_TEST.+|PO_TODO_INCLUIDO.+|PO_Ucrania.+|PO_Venezuela.+"}[10m]) OR vector(0)))))) * 100 > 5
        annotations:
          brief: 'General alert for service operation, error rate is more than 5% for the past 10 minutes.'
          procedure: 'Check this alerts graphs from prometheus if the errors keep producing and which definition is alerting. Escalate to L2 and on-call if needed. Alert made on QOPS-11665'
        labels:
          severity: critical
      - alert: SubscribtionNetworkServicesErrors
        expr: (((sum by (definition) (increase(flex_bpmn_activity_error_received_total{app!="",definition=~"PO.+Call.+||PO_KeepMyNumber.+|PO.+Voicemail.+|PO_Telefonica_Network"}[10m]) OR vector(0)))) / ((((sum by (definition) (increase(flex_bpmn_process_completed_total{app!="",definition=~"PO.+Call.+||PO_KeepMyNumber.+|PO.+Voicemail.+|PO_Telefonica_Network"}[10m]) OR vector(0))))) + ((sum by (definition) (increase(flex_bpmn_activity_error_received_total{app!="",definition=~"PO.+Call.+||PO_KeepMyNumber.+|PO.+Voicemail.+|PO_Telefonica_Network"}[10m]) OR vector(0)))))) * 100 > 5
        annotations:
          brief: 'Alert for subscription_network_services product orders, error rate is over 5% for the past 10 minutes.'
          procedure: 'Check this alerts graphs from prometheus if the errors keep producing and which definition is alerting. Escalate to L2 and on-call if needed. Alert made on QOPS-11665'
        labels:
          severity: critical
      - alert: ServiceBarringOperationsErrors
        expr: (((sum by (definition) (increase(flex_bpmn_activity_error_received_total{app!="",definition=~"PO_Data.+||PO_Incoming.+|PO_International.+|PO_Outgoing.+|PO_Premium.+|PO_Roaming.+|PO_Unexpected_Charges|PO_VAS_Total_Block"}[10m]) OR vector(0)))) / ((((sum by (definition) (increase(flex_bpmn_process_completed_total{app!="",definition=~"PO_Data.+||PO_Incoming.+|PO_International.+|PO_Outgoing.+|PO_Premium.+|PO_Roaming.+|PO_Unexpected_Charges|PO_VAS_Total_Block"}[10m]) OR vector(0))))) + ((sum by (definition) (increase(flex_bpmn_activity_error_received_total{app!="",definition=~"PO_Data.+||PO_Incoming.+|PO_International.+|PO_Outgoing.+|PO_Premium.+|PO_Roaming.+|PO_Unexpected_Charges|PO_VAS_Total_Block"}[10m]) OR vector(0)))))) * 100 > 5
        annotations:
          brief: 'Alert for service_barring product orders, error rate is more than 5% for the past 10 minutes.'
          procedure: 'Check this alerts graphs from prometheus if the errors keep producing and which definition is alerting. Escalate to L2 and on-call if needed. Alert made on QOPS-11665'
        labels:
          severity: critical
      - alert: ReactivationErrors
        expr: (((sum by (definition) (increase(flex_bpmn_activity_error_received_total{app!="",definition=~".+Suspension.+.Cease"}[10m]) OR vector(0)))) / ((((sum by (definition) (increase(flex_bpmn_process_completed_total{app!="",definition=~".+Suspension.+.Cease"}[10m]) OR vector(0))))) + ((sum by (definition) (increase(flex_bpmn_activity_error_received_total{app!="",definition=~".+Suspension.+.Cease"}[10m]) OR vector(0)))))) * 100 > 5
        annotations:
          brief: 'Alert for reactivation product orders , error rate is more than 5% for the past 10 minutes.'
          procedure: 'Check this alerts graphs from prometheus if the errors keep producing and which definition is alerting. Escalate to L2 and on-call if needed. Alert made on QOPS-11665'
        labels:
          severity: critical
{{- end }}