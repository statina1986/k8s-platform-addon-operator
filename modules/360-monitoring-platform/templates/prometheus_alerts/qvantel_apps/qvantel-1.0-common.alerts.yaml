{{- if $.Values.monitoringPlatform.qvantelMonitoring.applications.commonOnePointZero }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: monitoring-platform-kube-p-application-behavior.rules
  namespace: {{.Release.Namespace}}
  generation: 1
  annotations:
    meta.helm.sh/release-name: monitoring-platform
    meta.helm.sh/release-namespace: {{.Release.Namespace}}
  labels:
    app: kube-prometheus-stack
    release: monitoring-platform
spec:
  groups:
  - name: application-behavior.alerts
    rules:
      - alert: ThreadStarvationDetected
        expr: round(increase(thread_starvation_detector_executions_total{success="false"}[1h]) > 3)
        labels:
          severity: warning
          level: application
          package: base
        annotations:
          brief: 'The threadpool/dispatcher {{` {{$labels.name}} `}} for {{` {{$labels.job}} `}} has {{` {{$value}} `}} failed thread pool starvation tests during the last 1 hour'
          procedure: >
              A failing threadpool test is an indicator that the pool is exhausted and not being able to execute jobs efficiently.
              There are many potential reasons for this but recurring alerts and/or prolonged issues can lead to loss of traffic or failed health responses resulting in application death.
              The team responsible for the application needs to be notified
      - alert: Occasional5XXCalls
        expr: sum(rate(http_server_requests_total{http_status_code="5xx"}[1h])) by(app) / sum(rate(http_server_requests_total{http_status_code="2xx"}[1h])) by(app) * 100 > 2
        labels:
          severity: warning
          level: application
          package: base
        annotations:
          brief: "More than 2% of calls in {{` {{ $labels.app }} `}} are receiving 5XX status code"
          procedure: "Escalate to L2 team to check the application involved"
      - alert: Frequent5XXCalls
        expr: sum(rate(http_server_requests_total{http_status_code="5xx"}[1h])) by(app) / sum(rate(http_server_requests_total{http_status_code="2xx"}[1h])) by(app) * 100 > 4
        labels:
          severity: critical
          level: application
          package: base
        annotations:
          brief: "More than 4% of calls in {{` {{ $labels.app }} `}} are receiving 5XX status code"
          procedure: "Escalate to L2 team ASAP to check the application involved"       
      - alert: Occasional4XXCalls
        expr: sum(rate(http_server_requests_total{http_status_code="4xx"}[1h])) by(app) / sum(rate(http_server_requests_total{http_status_code="2xx"}[1h])) by(app) * 100 > 40
        labels:
          severity: warning
          level: application
          package: base
        annotations:
          brief: "More than 40% of calls in {{` {{ $labels.app }} `}} are receiving 4XX status code"
          procedure: "Escalate to L2 team to check the application involved"
      - alert: Frequent4XXCalls
        expr: sum(rate(http_server_requests_total{http_status_code="4xx"}[1h])) by(app) / sum(rate(http_server_requests_total{http_status_code="2xx"}[1h])) by(app) * 100 > 60
        labels:
          severity: critical
          level: application
          package: base
        annotations:
          brief: "More than 60% of calls in {{` {{ $labels.app }} `}} are receiving 4XX status code"
          procedure: "Escalate to L2 team ASAP to check the application involved"  
{{- end }}