{{- if $.Values.monitoringPlatform.qvantelMonitoring.modules.consul }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations:
    meta.helm.sh/release-name: monitoring-platform
    meta.helm.sh/release-namespace: {{.Release.Namespace}}
  generation: 1
  labels:
    release: monitoring-platform
  name: monitoring-platform-consul
spec:
  endpoints:
    - honorTimestamps: true
      path: '/v1/agent/metrics'
      scheme: http
      scrapeTimeout: 30s
      params:
        format: ['prometheus']
      targetPort: 8500
  selector:
    matchLabels:
      app: consul
      release: consul-platform
      component: server
{{- end }}