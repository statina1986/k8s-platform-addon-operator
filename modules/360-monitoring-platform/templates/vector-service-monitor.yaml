    release: monitoring-platform
  name: vector-aggregator-service-monitor
spec:
  endpoints:
    - honorTimestamps: true
      path: '/metrics'
      scheme: http
      scrapeTimeout: 30s
      params:
        format: ['prometheus']
      targetPort: 9598
  selector:
    matchLabels:
      app.kubernetes.io/instance: vector-platform
      app.kubernetes.io/name: aggregator