# keycloakPlatformNamespace: keycloak
keycloakPlatform:
  adminUsername: "admin"
  adminPassword: "" # set keycloak admin password or leave empty to be autogenerated
  database:
    name: qvt-postgredb
  configurator:
    image: "artifactory.qvantel.net/qinstaller-keycloak-configurator:1.13.1.20231201141851_develop_32d2199d"
    spec: |
      backoffLimit: 5
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: keycloak-configurator
            image: {{ .Values.keycloakPlatform.configurator.image }}
            command:
            - /opt/docker/configurator.py
            volumeMounts:
              - name: config-volume
                mountPath: "/config"
                readOnly: true
            env:
              # this must match keycloak kubernetes "service"
              - name: KEYCLOAK_BASE
                value: "http://qvaa-proxy-80.platform.svc/auth"
              # this must match the mount and the configmap file in the mount
              - name: CONFIGURATOR_CONFIG
                value: /config/configurator.yml
            envFrom:
              - secretRef:
                  name: keycloak-admin-secret
          volumes:
            - name: config-volume
              projected:
                sources:
                  - configMap:
                      name: configurator-configmap
                      items:
                        - key: configurator.yml
                          path: configurator.yml
    configmap: |
      configurator.yml: ""
  deployment:
    additionalLabels: null
    replicaCount: 1
    image: "artifactory.qvantel.net/qvaa-keycloak-qrp-postgres-quarkus:23.0.4.2.20240116085404_master_9cdb6973"
    spec: |
      progressDeadlineSeconds: 600
      replicas: {{ .Values.keycloakPlatform.deployment.replicaCount }}
      selector:
        matchLabels:
          app: qvaa-keycloak
      template:
        metadata:
          annotations:
            app.kubernetes.io/name: keycloak
            vault.security.banzaicloud.io/enable-json-log: "true"
            vault.security.banzaicloud.io/log-level: warn
            vault.security.banzaicloud.io/vault-addr: http://vault.platform.svc:8200
            vault.security.banzaicloud.io/vault-env-daemon: "true"
            vault.security.banzaicloud.io/vault-ignore-missing-secrets: "false"
            vault.security.banzaicloud.io/vault-role: platform-qvaa-keycloak
          labels:
            app: qvaa-keycloak
        spec:
          serviceAccountName: keycloak
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                  - key: app
                    operator: In
                    values:
                    - qvaa-keycloak
                topologyKey: kubernetes.io/hostname
          containers:
          - env:
            - name: APP_DOCKER_IMAGE
              value: {{ .Values.keycloakPlatform.deployment.image }}
            - name: METASPACE_SIZE
              value: 256m
            - name: KC_LOG_LEVEL
              value: info,org.keycloak.events:debug
            - name: SERVICE_NAME
              value: qvaa-keycloak
            - name: MAX_METASPACE_SIZE
              value: 256m
            - name: XMX
              value: 512m
            - name: XMS
              value: 512m
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://qvt-postgredb.platform.svc/keycloak
            - name: KC_DB_USERNAME
              value: vault:database/creds/postgresql_qvaa-keycloak#username
            - name: KC_DB_PASSWORD
              value: vault:database/creds/postgresql_qvaa-keycloak#password
            - name: INSTANA_AGENT_HOST
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.hostIP
            envFrom:
              - secretRef:
                  name: keycloak-admin-secret
            image: {{ .Values.keycloakPlatform.deployment.image }}
            imagePullPolicy: IfNotPresent
            livenessProbe:
              failureThreshold: 3
              httpGet:
                httpHeaders:
                - name: CheckType
                  value: liveness
                path: /auth/health
                port: 80
                scheme: HTTP
              initialDelaySeconds: 300
              periodSeconds: 60
              successThreshold: 1
              timeoutSeconds: 20
            name: qvaa-keycloak
            ports:
            - containerPort: 80
              protocol: TCP
            readinessProbe:
              failureThreshold: 3
              httpGet:
                httpHeaders:
                - name: CheckType
                  value: readiness
                path: /auth/health
                port: 80
                scheme: HTTP
              initialDelaySeconds: 10
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 9
            resources:
              limits:
                memory: 1G
              requests:
                cpu: 100m
