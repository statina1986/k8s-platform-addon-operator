---
{{- $secret := (randAscii 32 | b64enc) }}
{{- $secretData := (lookup "v1" "Secret" .Release.Namespace "vault-client-secret").data }}
{{- if $secretData }}
{{- $secret = (index $secretData "VAULT_CLIENT_SECRET" | b64dec) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: "vault-client-secret"
  namespace: {{.Release.Namespace}}
type: Opaque
data:
  VAULT_CLIENT_SECRET: {{ $secret | b64enc }}
