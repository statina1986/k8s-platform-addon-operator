apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server-tls
  namespace: vault
spec:
  # Secret names are always required.
  secretName: vault-server-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  subject:
    organizations:
      - Qvantel
  # The use of the common name field has been deprecated since 2000 and is
  # discouraged from being used.
  commonName: vault.platform.qvantel.com
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  # At least one of a DNS Name, URI, or IP address is required.
  dnsNames:
    - vault-platform-0.vault-platform-internal
    - vault-platform-1.vault-platform-internal
    - vault-platform-2.vault-platform-internal
  # Issuer references are always required.
  issuerRef:
    name: platform-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io