apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: platform-selfsigned-issuer
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-selfsigned-ca
spec:
  isCA: true
  commonName: platform.qvantel.com
  secretName: platform-root-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: platform-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: platform-ca-issuer
spec:
  ca:
    secretName: platform-root-ca