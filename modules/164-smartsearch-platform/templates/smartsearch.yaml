apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: smartsearch
  namespace: {{.Release.Namespace}}
spec:
  version: 7.16.2
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  nodeSets:
  - name: smartsearch
    count: 1
    config:
      node.master: true
      node.data: true
      node.ingest: true
      node.store.allow_mmap: false    
      xpack.security.authc:
        anonymous:
          authz_exception: false
          roles: superuser
          username: anonymous
    volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 100Gi
    podTemplate:
      spec:
        containers:
          - name: elasticsearch
            image: artifactory.qvantel.net/helm-k8s-elasticsearch:7.16.2
            resources:
              requests:
                memory: 1Gi
                cpu: 0.1
              limits:
                memory: 2Gi
                cpu: 0.2