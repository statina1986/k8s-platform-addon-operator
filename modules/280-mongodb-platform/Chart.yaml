apiVersion: v2
name: mongodb-platform
version: 0.0.1
dependencies:
- name: mongodbPlatform
  version: 0.0.1

# Overriding bitnami annotations by setting images-key to 
# platform-images because they are no longer available

annotations:
  images-key: platform-images
  platform-images: |
    - image: platform.artifactory.qvantel.net/platform/bitnami-mongodb:7.0.28
      name: mongodb-qvantel
    - name: kubectl
      image: platform.artifactory.qvantel.net/platform/platform-k8s-tools-minimal:1.3.3_202509080945_master_90384dcc
    - name: mongodb-exporter
      image: docker.io/bitnamilegacy/mongodb-exporter:0.40.0-debian-12-r30
    - name: nginx
      image: docker.io/bitnamilegacy/nginx:1.27.0-debian-12-r2
    - name: os-shell
      image: platform.artifactory.qvantel.net/platform/platform-k8s-tools-minimal:1.3.3_202509080945_master_90384dcc