kafkaPlatform:
  strimzi-kafka-operator:
    resources:
      limits:
        memory: 1Gi
        cpu: "1"
      requests:
        memory: 384Mi
        cpu: 200m
  clusters:
    - name: kafka-cluster
      enabled: true
      spec:
        kafka:
          version: 2.8.1
          replicas: 3
          listeners:
            - name: plain
              port: 9092
              type: internal
              tls: false
            - name: tls
              port: 9093
              type: internal
              tls: true
          readinessProbe:
            initialDelaySeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            initialDelaySeconds: 15
            timeoutSeconds: 5
          config:
            auto.create.topics.enable: "true"
            default.replication.factor: 3
            log.message.format.version: "2.8"
            num.partitions: 3
            offsets.topic.replication.factor: 3
            transaction.state.log.min.isr: 2
            transaction.state.log.replication.factor: 3
            min.insync.replicas: 2
          storage:
            type: persistent-claim
            size: 100Gi
            deleteClaim: false
          metricsConfig:
            type: jmxPrometheusExporter
            valueFrom:
              configMapKeyRef:
                name: kafka-metrics
                key: kafka-metrics-config.yml
          rack:
            topologyKey: topology.kubernetes.io/zone
          template:
            pod:
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchExpressions:
                          - key: strimzi.io/cluster
                            operator: In
                            values:
                              - kafka-cluster
                          - key: strimzi.io/name
                            operator: In
                            values:
                              - kafka-cluster-kafka
                      topologyKey: kubernetes.io/hostname
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: topology.kubernetes.io/zone
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      strimzi.io/cluster: kafka-cluster
                      strimzi.io/name: kafka-cluster-kafka
        zookeeper:
          replicas: 3
          readinessProbe:
            initialDelaySeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            initialDelaySeconds: 15
            timeoutSeconds: 5
          storage:
            type: persistent-claim
            size: 100Gi
            deleteClaim: false
          metricsConfig:
            type: jmxPrometheusExporter
            valueFrom:
              configMapKeyRef:
                name: kafka-metrics
                key: zookeeper-metrics-config.yml
          template:
            pod:
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchExpressions:
                          - key: strimzi.io/cluster
                            operator: In
                            values:
                              - kafka-cluster
                          - key: strimzi.io/name
                            operator: In
                            values:
                              - kafka-cluster-zookeeper
                      topologyKey: kubernetes.io/hostname
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: topology.kubernetes.io/zone
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      strimzi.io/cluster: kafka-cluster
                      strimzi.io/name: kafka-cluster-zookeeper
        entityOperator:
          topicOperator: {}
          userOperator: {}
        kafkaExporter:
          topicRegex: ".*"
          groupRegex: ".*"
