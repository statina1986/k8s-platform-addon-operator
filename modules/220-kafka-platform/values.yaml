kafkaPlatform:
  strimzi-kafka-operator:
    resources:
      limits: {}
      requests:
        memory: 384Mi
        cpu: 200m
  cluster:
    kafka:
      version: 2.8.1
      replicas: 3
      listeners:
        - name: plain
          port: 9092
          type: internal
          tls: false
        - name: tls
          port: 9093
          type: internal
          tls: true
      readinessProbe:
        initialDelaySeconds: 15
        timeoutSeconds: 5
      livenessProbe:
        initialDelaySeconds: 15
        timeoutSeconds: 5
      config:
        auto.create.topics.enable: "true"
        default.replication.factor: 3
        log.message.format.version: "2.8"
        num.partitions: 3
        offsets.topic.replication.factor: 3
        transaction.state.log.min.isr: 2
        transaction.state.log.replication.factor: 3
        min.insync.replicas: 2
      storage:
        type: persistent-claim
        size: 100Gi
        deleteClaim: false
      metricsConfig:
        type: jmxPrometheusExporter
        valueFrom:
          configMapKeyRef:
            name: kafka-metrics
            key: kafka-metrics-config.yml
    zookeeper:
      replicas: 3
      readinessProbe:
        initialDelaySeconds: 15
        timeoutSeconds: 5
      livenessProbe:
        initialDelaySeconds: 15
        timeoutSeconds: 5
      storage:
        type: persistent-claim
        size: 100Gi
        deleteClaim: false
      metricsConfig:
        type: jmxPrometheusExporter
        valueFrom:
          configMapKeyRef:
            name: kafka-metrics
            key: zookeeper-metrics-config.yml
    entityOperator:
      topicOperator: {}
      userOperator: {}
    kafkaExporter:
      topicRegex: ".*"
      groupRegex: ".*"
