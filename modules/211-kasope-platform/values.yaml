kasopePlatform:
  k8ssandra-operator:
    cass-operator:
      admissionWebhooks:
        enabled: false
  mainCassandraCluster: "cluster"
  clusters:
    cluster:
      enabled: true
      spec:
        cassandra:
          serviceAccount: platform
          serverVersion: "3.11.13"
          metadata:
            services:
              dcService:
                annotations:
                  consul.hashicorp.com/service-port: native
              allPodsService:
                annotations:
                  consul.hashicorp.com/service-port: native
          config:
            cassandraYaml:
              num_tokens: 8
            jvmOptions:
              heapSize: 4Gi
          storageConfig:
            cassandraDataVolumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 100Gi
          resources:
            requests:
              memory: 8Gi
          datacenters:
            - metadata:
                name: dc1
                services:
                  dcService:
                    annotations:
                      consul.hashicorp.com/service-port: native
                  allPodsService:
                    annotations:
                      consul.hashicorp.com/service-port: native
              size: 3
          telemetry:
            cassandra:
              endpoint:
                address: "0.0.0.0"
              relabels:
                - action: drop
                  regex: ^org_apache_cassandra_metrics_table_cas_prepare_latency$|^org_apache_cassandra_metrics_table_cas_propose_latency$|^org_apache_cassandra_metrics_table_cas_commit_latency$|^org_apache_cassandra_metrics_table_view_read_time$|^org_apache_cassandra_metrics_table_view_lock_acquire_time$|^org_apache_cassandra_metrics_table_read_latency$|^org_apache_cassandra_metrics_table_coordinator_scan_latency$|^org_apache_cassandra_metrics_table_coordinator_read_latency$|^org_apache_cassandra_metrics_table_range_latency$|^org_apache_cassandra_metrics_table_write_latency$|^org_apache_cassandra_metrics_table_ss_tables_per_read$|^org_apache_cassandra_metrics_table_waiting_on_free_memtable_space$|^org_apache_cassandra_metrics_table_replica_filtering_protection_rows_cached_per_query$|^org_apache_cassandra_metrics_table_live_scanned$|^org_apache_cassandra_metrics_table_col_update_time_delta$|^org_apache_cassandra_metrics_cache_capacity$
                  sourceLabels:
                    - __name__
            prometheus:
              enabled: true
              commonLabels:
                release: monitoring-platform
            mcac:
              enabled: false
        reaper:
          autoScheduling:
            enabled: true
