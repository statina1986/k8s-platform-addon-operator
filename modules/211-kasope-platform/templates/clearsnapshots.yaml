{{- if .Values.kasopePlatform.clusters }}
{{- range $name := keys .Values.kasopePlatform.clusters }}
{{- $current := get $.Values.kasopePlatform.clusters $name }}
{{- if $current.enabled }}

apiVersion: batch/v1
kind: CronJob
metadata:
  name: cassandra-snapshot-cleaner
  namespace: {{ $.Release.Namespace }}
spec:
  # Run at 00:00 on the 1st day of every month
  schedule: "0 0 1 * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: platform
          containers:
            - name: snapshot-cleaner
              image: {{ $.Values.global.containerRegistryBase | default "platform.artifactory.qvantel.net" }}/platform/platform-k8s-tools-minimal:1.3.2_202508131123_master_e140ddde # Use kubectl image
              command:
              - /bin/sh
              - -c
              - |
                # Extract the cluster name from the label
                CLUSTER_NAME=$(kubectl get pod -n {{ $.Release.Namespace }} -l app.kubernetes.io/name=cassandra -o jsonpath='{.items[0].metadata.labels.cassandra\.datastax\.com/cluster}')
                # Construct the username
                USER="${CLUSTER_NAME}-superuser"

                # Extract the password from the secret
                PASSWORD=$(kubectl get secret "$USER" -n {{ $.Release.Namespace }} -o jsonpath="{.data.password}" | base64 --decode)

                # Clear snapshots
                for pod in $(kubectl get pods -n {{ $.Release.Namespace }} -l app.kubernetes.io/name=cassandra -o jsonpath='{.items[*].metadata.name}'); do
                  kubectl exec -it -n {{ $.Release.Namespace }} $pod -c cassandra -- nodetool -u $USER -pw $PASSWORD clearsnapshot --all;
                done

          restartPolicy: OnFailure # Retry the job if it fails

{{- end }}
{{- end }}
{{- end }}
