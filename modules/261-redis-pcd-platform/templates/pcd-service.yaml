apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-headless-redis-pcd
spec:
  clusterIP: None # <= Don't forget!!
  selector:
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: redis-cbs-pcd-platform
    app.kubernetes.io/name: redis
  ports:
    - protocol: TCP
      port: 26379
      targetPort: 26379
