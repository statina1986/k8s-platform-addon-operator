apiVersion: v1
kind: Service
metadata:
  app.kubernetes.io/component: node
    app.kubernetes.io/instance: redis-cbs-pcd-platform
    app.kubernetes.io/name: redis
spec:
  selector:
    app: redis-sentinel-redis-pcd
  ports:
    - protocol: TCP
      port: 26379
      targetPort: 26379