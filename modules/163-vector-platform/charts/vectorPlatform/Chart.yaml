apiVersion: v2
name: vectorPlatform
version: 0.0.1
dependencies:
  - name: vector
    alias: agent
    condition: agent.enabled
    repository: https://helm.vector.dev
    version: "^0.36.1"
  - name: vector
    alias: aggregator
    condition: aggregator.enabled
    repository: https://helm.vector.dev
    version: "^0.36.1"
  - name: fluent-bit
    alias: fluent-bit-events-collector
    condition: fluent-bit-events-collector.enabled
    repository: https://fluent.github.io/helm-charts
    version: "^0.47.10"