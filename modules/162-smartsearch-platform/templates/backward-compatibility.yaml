apiVersion: v1
kind: Service
metadata:
  name: smartsearch-elasticsearch-client
  namespace: {{.Release.Namespace}}
  labels:
    app.kubernetes.io/instance: {{ .Values.global.helmReleaseNamePrefix }}smartsearch-platform
spec:
  ports:
    - name: http
      protocol: TCP
      port: 9200
      targetPort: 9200
  selector:
    app.kubernetes.io/instance: {{ .Values.global.helmReleaseNamePrefix }}smartsearch-platform
  type: ClusterIP
  sessionAffinity: None
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack