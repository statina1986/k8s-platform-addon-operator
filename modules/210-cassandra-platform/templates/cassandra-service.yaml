apiVersion: v1
kind: Service
metadata:
  labels:
    cassandra.datastax.com/cluster: cassandra
    cassandra.datastax.com/datacenter: dc1
  name: cassandra
  namespace: platform
spec:
  ports:
  - name: native
    port: 9042
    protocol: TCP
    targetPort: 9042
  - name: tls-native
    port: 9142
    protocol: TCP
    targetPort: 9142
  - name: mgmt-api
    port: 8080
    protocol: TCP
    targetPort: 8080
  - name: prometheus
    port: 9103
    protocol: TCP
    targetPort: 9103
  - name: thrift
    port: 9160
    protocol: TCP
    targetPort: 9160
  selector:
    cassandra.datastax.com/cluster: cassandra
    cassandra.datastax.com/datacenter: dc1
  sessionAffinity: None
  type: ClusterIP