# vaultPlatformNamespace: vault
vaultPlatform:
  vault:
    global:
      enabled: true
    injector:
      enabled: false
    server:        
      image:
        tag: "1.9.3"
      readinessProbe:
        enabled: true
        path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
      livenessProbe:
        enabled: true
        path: "/v1/sys/health?standbyok=true&sealedcode=204"
        initialDelaySeconds: 60
      extraVolumes: 
        - type: configMap
          name: vault-auto-init-config
          defaultMode: 0777
      extraContainers:
        - name: auto-init-sidecar
          args:
          - /init-script/init.sh
          command:
          - /bin/sh
          env:
            - name: VAULT_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: VAULT_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
          image: artifactory.qvantel.net/k8s-platform-tools:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
          - mountPath: /init-script/
            name: userconfig-vault-auto-init-config
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true
            listener "tcp" {
              address = "[::]:8200"
              cluster_address = "[::]:8201"
              tls_disable = "true"
            }

            storage "raft" {
              path = "/vault/data"
                retry_join {
                leader_api_addr = "http://vault-platform-0.vault-platform-internal:8200"
              }
              retry_join {
                leader_api_addr = "http://vault-platform-1.vault-platform-internal:8200"
              }
              retry_join {
                leader_api_addr = "http://vault-platform-2.vault-platform-internal:8200"
              }

              autopilot {
                cleanup_dead_servers = "true"
                last_contact_threshold = "200ms"
                last_contact_failure_threshold = "10m"
                max_trailing_logs = 250000
                min_quorum = 5
                server_stabilization_time = "10s"
              }

            }

            service_registration "kubernetes" {}