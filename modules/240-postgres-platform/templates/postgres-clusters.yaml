{{- if .Values.postgresPlatform.clusters }}
{{- range keys .Values.postgresPlatform.clusters  }}
{{- $current := get $.Values.postgresPlatform.clusters . }}
{{- if $current.enabled }}
---
apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: {{ . }}
spec:
  {{- toYaml $current.spec | nindent 2 }}
  
{{- if $current.vaultConfiguration }}
---
apiVersion: platform-vault.qvantel.com/v1
kind: DbRole
metadata:
  name: {{ . }}-admin-role
spec:
  db-name: {{ . }}
  creation-statements: >-
          {{ printf "CREATE USER \"{{name}}\" SUPERUSER PASSWORD '{{password}}' VALID UNTIL '{{expiration}}';" }}

---
apiVersion: platform-vault.qvantel.com/v1
kind: DbConnection
metadata:
  annotations:
    platform.qvantel.com/retry-count: "100"
  name: {{ . }}  
spec:
  connection-name: {{ . }}
  plugin-name: postgresql-database-plugin
  allowed-roles: '*'
  computed-values:
  - expression: k8s_get_secret_value('postgres.{{ . }}.credentials.postgresql.acid.zalan.do','platform','username')
    name: secret-username
  - expression: k8s_get_secret_value('postgres.{{ . }}.credentials.postgresql.acid.zalan.do','platform','password')
    name: secret-password
  db-url: >-
    {{ printf "postgresql://{{username}}:{{password}}@%s.platform.svc:5432/postgres" . }}
  db-username: '{secret-username}'
  db-password: '{secret-password}'
{{- end }}

{{- end }}
{{- end }}
{{- end }}
