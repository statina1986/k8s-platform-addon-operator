apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: qvt-postgredb
  namespace: {{ .Release.Namespace }}
spec:
  teamId: "qvt"
  volume:
    size: 150Gi
  numberOfInstances: 2
  resources:
    limits:
      cpu: 1000m
      memory: 6Gi
    requests:
      cpu: 250m
      memory: 256Mi
  postgresql:
    version: "13"