apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterturndowns.platform.qvantel.com
spec:
  group: platform.qvantel.com
  scope: Namespaced
  names:
    # plural name to be used in the URL: /apis/<group>/<version>/<plural>
    plural: clusterturndowns
    # singular name to be used as an alias on the CLI and for display
    singular: clusterturndown
    # kind is normally the CamelCased singular type. Your resource manifests use this.
    kind: ClusterTurndown
    # shortNames allow shorter string to match your resource on the CLI
    shortNames:
      - ctd
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - description: Desired State
          jsonPath: .spec.desiredState
          name: DesiredState
          type: string
        - description: Phase
          jsonPath: .status.conditions[?(@.type=="Phase")].reason
          name: Phase
          type: string
        - description: Ready
          jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
      schema:
        openAPIV3Schema:
          type: object
          description: State of cluster turndown and scaleup operations.
          required:
            - spec
          properties:
            spec:
              type: object
              properties:
                forceSyncGeneration:
                  type: integer
                desiredState:
                  type: string
                  description: Cron for the scaledown
                  enum:
                    - up
                    - down
                    - current
            status:
              description: The status of the cluster turndown/scaleup operation.
              type: object
              properties:
                conditions:
                  description: List of status conditions.
                  items:
                    properties:
                      lastTransitionTime:
                        description:
                          Last time the condition of a type changed from
                          one status to another. The required format is 'yyyy-MM-ddTHH:mm:ssZ',
                          in the UTC time zone.
                        type: string
                      message:
                        description:
                          Human-readable message indicating details about
                          the condition's last transition.
                        type: string
                      reason:
                        description:
                          The reason for the condition's last transition
                          (a single word in CamelCase).
                        type: string
                      status:
                        description:
                          The status of the condition, either True, False
                          or Unknown.
                        type: string
                      type:
                        description:
                          The unique identifier of a condition, used to distinguish
                          between other conditions in the resource.
                        type: string
                    type: object
                  type: array
                observedGeneration:
                  description:
                    The generation of the CRD that was last reconciled by
                    the operator.
                  type: integer
                state:
                  description:
                    Current known state of the cluster
                  type: string
        # subresources for the custom resource
      subresources:
        # enables the status subresource
        status: {}
