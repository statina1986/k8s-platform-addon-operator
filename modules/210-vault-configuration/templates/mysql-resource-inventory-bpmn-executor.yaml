apiVersion: platform.qvantel.com/v1
kind: VaultDbRole
metadata:
  name: mysql-resource-inventory-bpmn-executor
  namespace: platform
spec:
  creation-statement: "CREATE USER '{{name}}'@'%' IDENTIFIED BY '{{password}}'; GRANT ALL PRIVILEGES ON resource_inventory_bpmn_executor.* TO '{{name}}'@'%' WITH GRANT OPTION;"  
  db-name: x-aurora-mysql-database
  default-ttl: 1h
  max-ttl: 24h
  role-name: mysql_resource-inventory-bpmn-executor