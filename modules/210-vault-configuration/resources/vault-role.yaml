apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vaultroles.platform.qvantel.com
spec:
  group: platform.qvantel.com
  scope: Namespaced
  names:
    # plural name to be used in the URL: /apis/<group>/<version>/<plural>
    plural: vaultroles
    # singular name to be used as an alias on the CLI and for display
    singular: vaultrole
    # kind is normally the CamelCased singular type. Your resource manifests use this.
    kind: VaultRole
    # shortNames allow shorter string to match your resource on the CLI
    shortNames:
    - vr
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: Vault Database Role definition
          required:
            - spec
          properties:
            spec:
              type: object
              properties:
                type:
                  type: string
                  description: Type of the Vault role
                  enum:
                    - kubernetes-auth-role
                    - db-role
                role-name:
                  type: string
                  description: The name for this role.
                kubernetes-auth-role-spec:
                  type: object
                  properties:
                    bound_service_account_names:
                      type: array
                      description: List of service account names able to access this role. If set to "*" all names are allowed.
                      items:
                        type: string
                    bound_service_account_namespaces:
                      type: array
                      description: List of namespaces allowed to access this role. If set to "*" all namespaces are allowed.
                      items:
                        type: string
                    token_ttl:
                      type: string
                      description: The incremental lifetime for generated tokens. This current value of this will be referenced at renewal time.
                    token_max_ttl:
                      type: string
                      description: The maximum lifetime for generated tokens. This current value of this will be referenced at renewal time.
                    token_policies:
                      type: array
                      description: List of policies to encode onto generated tokens. Depending on the auth method, this list may be supplemented by user/group/other values.
                      items:
                        type: string
                db-role-spec:
                  type: object
                  properties:
                    db-name:
                      type: string
                      description: The name of the database connection to use for this role.
                    default-ttl:
                      type: string
                      description: Specifies the TTL for the leases associated with this role. Accepts time suffixed strings (1h) or an integer number of seconds. Defaults to system/engine default TTL time.
                    max-ttl:
                      type: string
                      description: Specifies the maximum TTL for the leases associated with this role. Accepts time suffixed strings (1h) or an integer number of seconds. Defaults to sys/mounts's default TTL time; this value is allowed to be less than the mount max TTL (or, if not set, the system max TTL), but it is not allowed to be longer.
                    creation-statement:
                      type: string
                      description: Specifies the database statements executed to create and configure a user. See the plugin's API page for more information on support and formatting for this parameter.