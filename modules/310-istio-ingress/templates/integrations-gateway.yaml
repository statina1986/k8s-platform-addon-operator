apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: integrations-ingress
spec:
  selector:
    istio: integrations-ingress
  servers:
    - hosts:
      - '*'
      port:
        name: http
        number: 80
        protocol: HTTP
    - hosts:
      - '*'
      port:
        name: https
        number: 443
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: qvantel-wildcard