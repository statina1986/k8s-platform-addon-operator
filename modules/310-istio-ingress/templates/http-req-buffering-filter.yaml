
{{- if .Values.istioIngress.privateIngressBufferHttpRequestSize  }}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: private-ingress-http-req-buffering-filter
  namespace: platform
spec:
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.buffer
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
            max_request_bytes: {{ .Values.istioIngress.privateIngressBufferHttpRequestSize }}
  workloadSelector:
    labels:
      istio: private-ingress
{{- end }}

