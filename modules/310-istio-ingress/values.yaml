istioIngress:
  publicIngressEnabled: true
  publicIngress:
    name: public-ingress
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-internal: "false"
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
  privateIngressEnabled: true
  privateIngress:
    name: private-ingress
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
  integrationsIngressEnabled: false
  integrationsIngress:
    name: integrations-ingress
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
  virtualServices:
    public:
      annotations:
      # external-dns.alpha.kubernetes.io/target: my-global-load-balancer.cloud.com
      dnsBase: pbl-qvantel-finland.qvantel.systems
      instances:
        auth:
          http:
            - match:
                - uri:
                    prefix: /auth/realms/qvantel/
              retries:
                attempts: 0
              route:
                - destination:
                    host: qvaa-proxy-80.qvantel.svc.cluster.local
                    port:
                      number: 80
            - match:
                - uri:
                    prefix: /auth/realms/consumers/
              retries:
                attempts: 0
              route:
                - destination:
                    host: qvaa-proxy-80.qvantel.svc.cluster.local
                    port:
                      number: 80
            - match:
                - uri:
                    prefix: /auth/resources/
              retries:
                attempts: 0
              route:
                - destination:
                    host: qvaa-proxy-80.qvantel.svc.cluster.local
                    port:
                      number: 80
    private:
      dnsBase: prv-qvantel-finland.qvantel.systems
      instances:
        address-manager:
          http:
            - route:
                - destination:
                    host: addresses.qvantel.svc.cluster.local
                    port:
                      number: 8000
        bssapi:
          http:
            - retries:
                attempts: 0
              route:
                - destination:
