istioIngress:
  publicIngressEnabled: true
  publicIngress:
    name: public-ingress
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-internal: "false"
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
  privateIngressEnabled: true
  privateIngress:
    name: private-ingress
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
  integrationsIngressEnabled: false
  integrationsIngress:
    name: integrations-ingress
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
  virtualServices:
    public:
      annotations:
        # external-dns.alpha.kubernetes.io/target: my-global-load-balancer.cloud.com
      dnsBase: pbl-qvantel-finland.qvantel.systems
      instances:
        auth:
          http:
          - match:
            - uri:
                prefix: /auth/realms/qvantel/
            retries:
              attempts: 0
            route:
            - destination:
                host: qvaa-proxy-80.qvantel.svc.cluster.local
                port:
                  number: 80
          - match:
            - uri:
                prefix: /auth/realms/consumers/
            retries:
              attempts: 0
            route:
            - destination:
                host: qvaa-proxy-80.qvantel.svc.cluster.local
                port:
                  number: 80
          - match:
            - uri:
                prefix: /auth/resources/
            retries:
              attempts: 0
            route:
            - destination:
                host: qvaa-proxy-80.qvantel.svc.cluster.local
                port:
                  number: 80
    private:
      dnsBase: prv-qvantel-finland.qvantel.systems
      instances: 
        address-manager:
          http:
            - route:
                - destination:
                    host: addresses.qvantel.svc.cluster.local
                    port:
                      number: 8000
        bssapi:
          http:
          - retries:
              attempts: 0
            route:
            - destination:
                host: bssapi-aggregator.qvantel.svc.cluster.local
                port:
                  number: 8080
        bssapi-docs:
          http:
          - retries:
              attempts: 0
            route:
            - destination:
                host: bssapi-documentation-service.qvantel.svc.cluster.local
                port:
                  number: 8010
        flex-admin:
          http:
          - retries:
              attempts: 0
            route:
            - destination:
                host: flex-admin.qvantel.svc.cluster.local
                port:
                  number: 21080
        vault-ui:
          http:
            - route:
                - destination:
                    host: vault-platform.platform.svc.cluster.local
                    port:
                      number: 8200
        consul-ui:          
          http:
            - route:
                - destination:
                    host: consul-platform-consul-ui.platform.svc.cluster.local
                    port:
                      number: 80
        kafka-ui:
          http:
            - route:
                - destination:
                    host: kafka-ui.platform.svc.cluster.local
                    port:
                      number: 8080
        kibana:
          http:
            - route:
                - destination:
                    host: kibana-kb-http.platform.svc.cluster.local
                    port:
                      number: 5601
        grafana:
          http:
            - route:
                - destination:
                    host: monitoring-platform-grafana.platform.svc.cluster.local
                    port:
                      number: 3000
        sct:
          http:
          - match:
            - uri:
                prefix: /images/
            retries:
              attempts: 0
            route:
            - destination:
                host: catalog-qflow-catalog-data.qvantel.svc.cluster.local
                port:
                  number: 80
          - retries:
              attempts: 0
            route:
            - destination:
                host: sales-and-care-toolbox-web.qvantel.svc.cluster.local
                port:
                  number: 9000
    integrations:
      dnsBase: int-qvantel-finland.qvantel.systems
      instances: 