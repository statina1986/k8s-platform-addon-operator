istioIngress:
# Public Ingress
  publicIngressEnabled: false
  publicIngressProxyProtocolEnabled: false
  publicIngress:
    name: public-ingress
    proxyProtocolEnabled: false
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-internal: "false"
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
        service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
  publicIngressGateways:
    - name: public-ingress
      spec: 
        selector:
          istio: public-ingress
        servers:
          - hosts:
            - '*'
            port:
              name: http
              number: 80
              protocol: HTTP
          - hosts:
            - '*'
            port:
              name: https
              number: 443
              protocol: HTTPS
            tls:
              mode: SIMPLE
              credentialName: qvantel-wildcard              
# Private Ingress
  privateIngressEnabled: false
  privateIngressProxyProtocolEnabled: false
  privateIngress:
    name: private-ingress
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
        service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
  privateIngressGateways:
    - name: private-ingress
      spec: 
        selector:
          istio: private-ingress
        servers:
          - hosts:
            - '*'
            port:
              name: http
              number: 80
              protocol: HTTP
          - hosts:
            - '*'
            port:
              name: https
              number: 443
              protocol: HTTPS
            tls:
              mode: SIMPLE
              credentialName: qvantel-wildcard
# IntegrationsHttp Ingress
  integrationsHttpIngressEnabled: false
  integrationsHttpIngressProxyProtocolEnabled: false
  integrationsHttpIngress:
    name: integrations-http-ingress
    proxyProtocolEnabled: false
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
        service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
  integrationsHttpIngressGateways:
  - name: integrations-http-ingress
    spec: 
      selector:
        istio: integrations-http-ingress
      servers:
        - hosts:
          - '*'
          port:
            name: http
            number: 80
            protocol: HTTP
        - hosts:
          - '*'
          port:
            name: https
            number: 443
            protocol: HTTPS
          tls:
            mode: SIMPLE
            credentialName: qvantel-wildcard
# IntegrationsNonHttp Ingress
  integrationsNonHttpIngressEnabled: false
  integrationsNonHttpIngressProxyProtocolEnabled: false
  integrationsNonHttpIngress:
    name: integrations-non-http-ingress
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
        service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
      ports:
        - name: status-port
          port: 15021
          protocol: TCP
          targetPort: 15021
        - name: sftp
          port: 22
          protocol: TCP
          targetPort: 22
  integrationsNonHttpIngressGateways:
    - name: integrations-non-http-ingress
      spec: 
        selector:
          istio: integrations-non-http-ingress
        servers:
          - hosts:
            - '*'
            port:
              name: sftp
              number: 22
              protocol: TCP
  virtualServices:
    annotations:
    # external-dns.alpha.kubernetes.io/target: my-global-load-balancer.cloud.com
    dnsBase: qvantel-finland.qvantel.systems
    instances:
      auth:
        enabled: false
        gateways:
          - public-ingress
        http:
          - match:
              - uri:
                  prefix: /auth/realms/qvantel/
            retries:
              attempts: 0
            route:
              - destination:
                  host: qvaa-proxy-80.qvantel.svc.cluster.local
                  port:
                    number: 80
          - match:
              - uri:
                  prefix: /auth/realms/consumers/
            retries:
              attempts: 0
            route:
              - destination:
                  host: qvaa-proxy-80.qvantel.svc.cluster.local
                  port:
                    number: 80
          - match:
              - uri:
                  prefix: /auth/resources/
            retries:
              attempts: 0
            route:
              - destination:
                  host: qvaa-proxy-80.qvantel.svc.cluster.local
                  port:
                    number: 80
      address-manager:
        enabled: false
        gateways:
          - private-ingress
        http:
