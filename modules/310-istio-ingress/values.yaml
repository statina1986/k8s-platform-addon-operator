istioIngress:
  pomeriumEnabled: false
  # Public Ingress
  publicIngressEnabled: false
  publicIngressProxyProtocolEnabled: false
  publicIngressLogFullRequest: false
  publicIngressLogFullResponse: false
  publicIngressBufferHttpRequestSize: 0
  publicIngress:
    name: public-ingress
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 9
      targetCPUUtilizationPercentage: 80
    labels:
      istio-ingress: "true"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1024Mi
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-internal: "false"
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
        service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: public-ingress
          istio: public-ingress
  publicIngressGateways:
  - name: public-ingress
    spec:
      selector:
        istio: public-ingress
      servers:
      - hosts:
        - '*'
        port:
          name: http
          number: 80
          protocol: HTTP
      - hosts:
        - '*'
        port:
          name: https
          number: 443
          protocol: HTTPS
        tls:
          mode: SIMPLE
          credentialName: qvantel-wildcard
          # Private Ingress
  privateIngressEnabled: false
  privateIngressProxyProtocolEnabled: false
  privateIngressLogFullRequest: false
  privateIngressLogFullResponse: false
  privateIngressBufferHttpRequestSize: 0
  privateIngress:
    name: private-ingress
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 9
      targetCPUUtilizationPercentage: 80
    labels:
      istio-ingress: "true"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1024Mi
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
        service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: private-ingress
          istio: private-ingress
  privateIngressGateways:
  - name: private-ingress
    spec:
      selector:
        istio: private-ingress
      servers:
      - hosts:
        - '*'
        port:
          name: http
          number: 80
          protocol: HTTP
      - hosts:
        - '*'
        port:
          name: https
          number: 443
          protocol: HTTPS
        tls:
          mode: SIMPLE
          credentialName: qvantel-wildcard
          # IntegrationsHttp Ingress
  integrationsHttpIngressEnabled: false
  integrationsHttpIngressProxyProtocolEnabled: false
  integrationsHttpIngressLogFullRequest: false
  integrationsHttpIngressLogFullResponse: false
  integrationsHttpIngressBufferHttpRequestSize: 0
