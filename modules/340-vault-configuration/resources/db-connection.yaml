apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dbconnections.platform-vault.qvantel.com
spec:
  group: platform-vault.qvantel.com
  scope: Namespaced
  names:
    # plural name to be used in the URL: /apis/<group>/<version>/<plural>
    plural: dbconnections
    # singular name to be used as an alias on the CLI and for display
    singular: dbconnection
    # kind is normally the CamelCased singular type. Your resource manifests use this.
    kind: DbConnection
    # shortNames allow shorter string to match your resource on the CLI
    shortNames:
    - dbc
  versions:
    - name: v1
      additionalPrinterColumns:
        - description: The state of the the sqlinstaller
          jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: Vault Database Role definition
          required:
            - spec
          properties:
            spec:
              type: object
              properties:
                connection_name:
                  type: string
                  description: The name of the connection to provision to Vault.
                connection_url:
                  type: string
                  description: The name of the database connection to use for this role.
                plugin_name:
                  type: string
                  description: Specifies the TTL for the leases associated with this role. Accepts time suffixed strings (1h) or an integer number of seconds. Defaults to system/engine default TTL time.
                allowed_roles:
                  type: string
                  description: Specifies the maximum TTL for the leases associated with this role. Accepts time suffixed strings (1h) or an integer number of seconds. Defaults to sys/mounts's default TTL time; this value is allowed to be less than the mount max TTL (or, if not set, the system max TTL), but it is not allowed to be longer.
                credentials_secret:
                  type: string
                  description: Specifies the database statements executed to create and configure a user. See the plugin's API page for more information on support and formatting for this parameter.
            status:
              description: The status of the deployment.
              type: object
              properties:
                conditions:
                  description: List of status conditions.
                  items:
                    properties:
                      lastTransitionTime:
                        description: Last time the condition of a type changed from
                          one status to another. The required format is 'yyyy-MM-ddTHH:mm:ssZ',
                          in the UTC time zone.
                        type: string
                      message:
                        description: Human-readable message indicating details about
                          the condition's last transition.
                        type: string
                      reason:
                        description: The reason for the condition's last transition
                          (a single word in CamelCase).
                        type: string
                      status:
                        description: The status of the condition, either True, False
                          or Unknown.
                        type: string
                      type:
                        description: The unique identifier of a condition, used to distinguish
                          between other conditions in the resource.
                        type: string
                    type: object
                  type: array
                observedGeneration:
                  description: The generation of the CRD that was last reconciled by
                    the operator.
                  type: integer
        # subresources for the custom resource
      subresources:
        # enables the status subresource                
        status: {}