apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kubernetesauthroles.platform-vault.qvantel.com
spec:
  group: platform-vault.qvantel.com
  scope: Namespaced
  names:
    # plural name to be used in the URL: /apis/<group>/<version>/<plural>
    plural: kubernetesauthroles
    # singular name to be used as an alias on the CLI and for display
    singular: kubernetesauthrole
    # kind is normally the CamelCased singular type. Your resource manifests use this.
    kind: KubernetesAuthRole
    # shortNames allow shorter string to match your resource on the CLI
    shortNames:
    - kar
  versions:
    - name: v1
      additionalPrinterColumns:
        - description: The state of the the sqlinstaller
          jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: Vault Database Role definition
          required:
            - spec
          properties:
            spec:
              type: object
              properties:
                role_name:
                  type: string
                  description: The name of the role to provision to Vault.
                bound_service_account_names:
                  type: array
                  description: List of service account names able to access this role. If set to "*" all names are allowed.
                  items:
                    type: string
                bound_service_account_namespaces:
                  type: array
                  description: List of namespaces allowed to access this role. If set to "*" all namespaces are allowed.
                  items:
                    type: string
                token_ttl:
                  type: string
                  description: The incremental lifetime for generated tokens. This current value of this will be referenced at renewal time.
                token_max_ttl:
                  type: string
                  description: The maximum lifetime for generated tokens. This current value of this will be referenced at renewal time.
                token_policies:
                  type: array
                  description: List of policies to encode onto generated tokens. Depending on the auth method, this list may be supplemented by user/group/other values.
                  items:
                    type: string
            status:
              description: The status of the deployment.
              type: object
              properties:
                conditions:
                  description: List of status conditions.
                  items:
                    properties:
                      lastTransitionTime:
                        description: Last time the condition of a type changed from
                          one status to another. The required format is 'yyyy-MM-ddTHH:mm:ssZ',
                          in the UTC time zone.
                        type: string
                      message:
                        description: Human-readable message indicating details about
                          the condition's last transition.
                        type: string
                      reason:
                        description: The reason for the condition's last transition
                          (a single word in CamelCase).
                        type: string
                      status:
                        description: The status of the condition, either True, False
                          or Unknown.
                        type: string
                      type:
                        description: The unique identifier of a condition, used to distinguish
                          between other conditions in the resource.
                        type: string
                    type: object
                  type: array
                observedGeneration:
                  description: The generation of the CRD that was last reconciled by
                    the operator.
                  type: integer
        # subresources for the custom resource
      subresources:
        # enables the status subresource                
        status: {}