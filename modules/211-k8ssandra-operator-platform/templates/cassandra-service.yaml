apiVersion: v1
kind: Service
metadata:
  labels:
    cassandra.datastax.com/cluster: k8ssandra
    cassandra.datastax.com/datacenter: datacenter1
  annotations:
    consul.hashicorp.com/service-ports: native
  name: k8ssandra
  namespace: platform
spec:
  ports:
  - name: native
    port: 9042
    protocol: TCP
    targetPort: 9042
  selector:
    cassandra.datastax.com/cluster: k8ssandra
    cassandra.datastax.com/datacenter: datacenter1
  sessionAffinity: None
  type: ClusterIP
