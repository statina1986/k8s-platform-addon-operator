name: "Copilot Setup Steps"

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Python dependencies
              run: |
                  pip install pyyaml==6.0.2 mako==1.3.10 "hvac[parser]==2.3.0" boto3==1.38.32 python-json-logger==3.3.0 py-consul==1.1.0

            - name: Set up Helm
              uses: azure/setup-helm@v4
              with:
                  version: "v3.17.3"
