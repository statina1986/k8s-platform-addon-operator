
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform
  namespace: {{ .Release.Namespace }}
  annotations:
  {{- if .Values.globalConfig.awsRole}}
    eks.amazonaws.com/role-arn: {{ .Values.globalConfig.awsRole }}
  {{- end }}

{{- if eq .Values.globalConfig.clusterwideResources "true" }}  
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: addon-operator-{{ .Release.Namespace }}
rules:
- apiGroups:
    - "*"
  resources:
    - "*"
  verbs:
    - "*"
- nonResourceURLs:
    - "*"
  verbs:
    - "*"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: addon-operator-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: addon-operator-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: platform
    namespace: {{ .Release.Namespace }}
{{- end }} 