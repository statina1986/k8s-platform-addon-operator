---
apiVersion: v1
kind: ConfigMap
metadata:
  name: addon-operator
  namespace: {{ .Values.addonOperatorNamespace }}
data:
  global: {{ print "|\n" (.Values.globalConfig | toYaml | indent 4) }}

  auroraMysqlDbEnabled: "{{ .Values.modulesConfig.auroraMysqlDbEnabled }}"
  auroraMysqlDb: {{ print "|\n" (.Values.modulesConfig.auroraMysqlDb | toYaml | indent 4) }}

  dbManagementEnabled: "{{ .Values.modulesConfig.dbManagementEnabled }}"
  dbManagement: {{ print "|\n" (.Values.modulesConfig.dbManagement | toYaml | indent 4) }}

  cassandraPlatformEnabled: "{{ .Values.modulesConfig.cassandraPlatformEnabled }}"
  cassandraPlatform: {{ print "|\n" (.Values.modulesConfig.cassandraPlatform | toYaml | indent 4) }}

  certPlatformEnabled: "{{ .Values.modulesConfig.certPlatformEnabled }}"
  certPlatform: {{ print "|\n" (.Values.modulesConfig.certPlatform | toYaml | indent 4) }}

  consulPlatformEnabled: "{{ .Values.modulesConfig.consulPlatformEnabled }}"
  consulPlatform: {{ print "|\n" (.Values.modulesConfig.consulPlatform | toYaml | indent 4) }}

  externalDnsEnabled: "{{ .Values.modulesConfig.externalDnsEnabled }}"
  externalDns: {{ print "|\n" (.Values.modulesConfig.externalDns | toYaml | indent 4) }}

  istioIngressEnabled: "{{ .Values.modulesConfig.istioIngressEnabled }}"
  istioIngress: {{ print "|\n" (.Values.modulesConfig.istioIngress | toYaml | indent 4) }}

  istioPlatformEnabled: "{{ .Values.modulesConfig.istioPlatformEnabled }}"
  istioPlatform: {{ print "|\n" (.Values.modulesConfig.istioPlatform | toYaml | indent 4) }}

  kafkaPlatformEnabled: "{{ .Values.modulesConfig.kafkaPlatformEnabled }}"
  kafkaPlatform: {{ print "|\n" (.Values.modulesConfig.kafkaPlatform | toYaml | indent 4) }}

  keycloakPlatformEnabled: "{{ .Values.modulesConfig.keycloakPlatformEnabled }}"
  keycloakPlatform: {{ print "|\n" (.Values.modulesConfig.keycloakPlatform | toYaml | indent 4) }}

  qinstallersEnabled: "{{ .Values.modulesConfig.qinstallersEnabled }}"
  
  vaultConfigurationEnabled: "{{ .Values.modulesConfig.vaultConfigurationEnabled }}"
  vaultConfiguration: {{ print "|\n" (.Values.modulesConfig.vaultConfiguration | toYaml | indent 4) }}
  
  vaultPlatformEnabled: "{{ .Values.modulesConfig.vaultPlatformEnabled }}"
  vaultPlatform: {{ print "|\n" (.Values.modulesConfig.vaultPlatform | toYaml | indent 4) }}


  
  
