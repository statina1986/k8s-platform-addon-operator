---
apiVersion: v1
kind: ConfigMap
metadata:
  name: addon-operator
  namespace: {{ .Values.addonOperatorNamespace }}
data:
  global: {{ print "|\n" (.Values.globalConfig | toYaml | indent 4) }}

  platformCoreEnabled: "false"
  platformCore: {{ print "|\n" (.Values.modulesConfig.platformCore | toYaml | indent 4) }}

  awsPlatformEnabled: "{{ .Values.modulesConfig.awsPlatformEnabled }}"
  awsPlatform: {{ print "|\n" (.Values.modulesConfig.awsPlatform | toYaml | indent 4) }}

  auroraMysqlDbEnabled: "{{ .Values.modulesConfig.auroraMysqlDbEnabled }}"
  auroraMysqlDb: {{ print "|\n" (.Values.modulesConfig.auroraMysqlDb | toYaml | indent 4) }}

  cassandraPlatformEnabled: "{{ .Values.modulesConfig.cassandraPlatformEnabled }}"
  cassandraPlatform: {{ print "|\n" (.Values.modulesConfig.cassandraPlatform | toYaml | indent 4) }}

  certPlatformEnabled: "{{ .Values.modulesConfig.certPlatformEnabled }}"
  certPlatform: {{ print "|\n" (.Values.modulesConfig.certPlatform | toYaml | indent 4) }}

  consulPlatformEnabled: "{{ .Values.modulesConfig.consulPlatformEnabled }}"
  consulPlatform: {{ print "|\n" (.Values.modulesConfig.consulPlatform | toYaml | indent 4) }}

  crossplanePlatformEnabled: "{{ .Values.modulesConfig.crossplanePlatformEnabled }}"
  crossplanePlatform: {{ print "|\n" (.Values.modulesConfig.crossplanePlatform | toYaml | indent 4) }}

  dbManagementEnabled: "{{ .Values.modulesConfig.dbManagementEnabled }}"
  dbManagement: {{ print "|\n" (.Values.modulesConfig.dbManagement | toYaml | indent 4) }}

  elasticsearchPlatformEnabled: "{{ .Values.modulesConfig.elasticsearchPlatformEnabled }}"
  elasticsearchPlatform: {{ print "|\n" (.Values.modulesConfig.elasticsearchPlatform | toYaml | indent 4) }}

  externalDnsEnabled: "{{ .Values.modulesConfig.externalDnsEnabled }}"
  externalDns: {{ print "|\n" (.Values.modulesConfig.externalDns | toYaml | indent 4) }}

  filebeatPlatformEnabled: "{{ .Values.modulesConfig.filebeatPlatformEnabled }}"
  filebeatPlatform: {{ print "|\n" (.Values.modulesConfig.filebeatPlatform | toYaml | indent 4) }}

  istioIngressEnabled: "{{ .Values.modulesConfig.istioIngressEnabled }}"
  istioIngress: {{ print "|\n" (.Values.modulesConfig.istioIngress | toYaml | indent 4) }}

  istioPlatformEnabled: "{{ .Values.modulesConfig.istioPlatformEnabled }}"
  istioPlatform: {{ print "|\n" (.Values.modulesConfig.istioPlatform | toYaml | indent 4) }}

  kafkaPlatformEnabled: "{{ .Values.modulesConfig.kafkaPlatformEnabled }}"
  kafkaPlatform: {{ print "|\n" (.Values.modulesConfig.kafkaPlatform | toYaml | indent 4) }}

  keycloakPlatformEnabled: "{{ .Values.modulesConfig.keycloakPlatformEnabled }}"
  keycloakPlatform: {{ print "|\n" (.Values.modulesConfig.keycloakPlatform | toYaml | indent 4) }}

  logstashPlatformEnabled: "{{ .Values.modulesConfig.logstashPlatformEnabled }}"
  logstashPlatform: {{ print "|\n" (.Values.modulesConfig.logstashPlatform | toYaml | indent 4) }}

  mariadbPlatformEnabled: "{{ .Values.modulesConfig.mariadbPlatformEnabled }}"
  mariadbPlatform: {{ print "|\n" (.Values.modulesConfig.mariadbPlatform | toYaml | indent 4) }}

  monitoringPlatformEnabled: "{{ .Values.modulesConfig.monitoringPlatformEnabled }}"
  monitoringPlatform: {{ print "|\n" (.Values.modulesConfig.monitoringPlatform | toYaml | indent 4) }}

  postgresPlatformEnabled: "{{ .Values.modulesConfig.postgresPlatformEnabled }}"
  postgresPlatform: {{ print "|\n" (.Values.modulesConfig.postgresPlatform | toYaml | indent 4) }}

  qinstallersEnabled: "{{ .Values.modulesConfig.qinstallersEnabled }}"

  vaultConfigurationEnabled: "{{ .Values.modulesConfig.vaultConfigurationEnabled }}"
  vaultConfiguration: {{ print "|\n" (.Values.modulesConfig.vaultConfiguration | toYaml | indent 4) }}

  vaultPlatformEnabled: "{{ .Values.modulesConfig.vaultPlatformEnabled }}"
  vaultPlatform: {{ print "|\n" (.Values.modulesConfig.vaultPlatform | toYaml | indent 4) }}

  redisPlatformEnabled: "{{ .Values.modulesConfig.redisPlatformEnabled }}"
  redisPlatform: {{ print "|\n" (.Values.modulesConfig.redisPlatform | toYaml | indent 4) }}

  redisPcdPlatformEnabled: "{{ .Values.modulesConfig.redisPcdPlatformEnabled }}"
  redisPcdPlatform: {{ print "|\n" (.Values.modulesConfig.redisPcdPlatform | toYaml | indent 4) }}

  redisCbsMasterPlatformEnabled: "{{ .Values.modulesConfig.redisCbsMasterPlatformEnabled }}"
  redisCbsMasterPlatform: {{ print "|\n" (.Values.modulesConfig.redisCbsMasterPlatform | toYaml | indent 4) }}

  redisCbsControllerPlatformEnabled: "{{ .Values.modulesConfig.redisCbsControllerPlatformEnabled }}"
  redisCbsControllerPlatform: {{ print "|\n" (.Values.modulesConfig.redisCbsControllerPlatform | toYaml | indent 4) }}
