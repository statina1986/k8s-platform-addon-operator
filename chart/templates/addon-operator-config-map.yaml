---
apiVersion: v1
kind: ConfigMap
metadata:
  name: addon-operator
  namespace: {{ .Release.Namespace }}
data:
  global: {{ print "|\n" (.Values.globalConfig | toYaml | indent 4) }}
  vaultConfigurationEnabled: "{{ .Values.modulesConfig.vaultConfigurationEnabled}}"
  auroraMysqlDbEnabled: "{{ .Values.modulesConfig.auroraMysqlDbEnabled}}"
  auroraMysqlDb: {{ print "|\n" (.Values.modulesConfig.auroraMysqlDb | toYaml | indent 4) }}
