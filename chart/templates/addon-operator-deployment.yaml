---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: addon-operator
  namespace: platform
  labels:
    app: addon-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: addon-operator
  template:
    metadata:
      labels:
        app: addon-operator
    spec:
      containers:
      - name: addon-operator
        image: sashaozz/addon-operator:latest
        imagePullPolicy: Always
        env:
          - name: ADDON_OPERATOR_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          - name: LOG_LEVEL
            value: debug
          - name: HELM_IGNORE_RELEASE
            value: postgres-operator
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9650
      serviceAccountName: addon-operator-acc
