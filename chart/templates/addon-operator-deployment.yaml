---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: addon-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app: addon-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: addon-operator
  template:
    metadata:
      labels:
        app: addon-operator
    spec:
      containers:
      - name: addon-operator
        image: {{ .Values.imageBase }}:{{ .Values.imageVersion | default .Chart.AppVersion }}
        imagePullPolicy: IfNotPresent
        env:
          - name: ADDON_OPERATOR_NAMESPACE
            value: {{ .Values.addonOperatorNamespace}}
          - name: LOG_LEVEL
            value: {{ .Values.logLevel}}
          - name: HELM_IGNORE_RELEASE
            value: {{ .Values.helmIgnoreRelease}}
          - name: INSIDE_CLUSTER
            value: "true"
          - name: COREDNS_FILE
            value: "{{ .Values.corednsFile }}"
          {{- range .Values.additionalEnvironmentVars }}
          - name: {{ .name }}
            value: {{ .value }}
          {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9650
      serviceAccountName: platform
