logLevel: info
addonOperatorNamespace: "platform"
platformCore: {}
helmIgnoreRelease: "k8s-platform"
imageBase: "artifactory.qvantel.net/k8s-platform-addon-operator"
deployment:
  replicas: 1
  additionalEnvironmentVars: []
  nodeSelector:
  #cluster-controller: "true"
  tolerations:
  # - effect: NoSchedule
  #   key: CriticalAddonsOnly
  #   operator: Exists
  # - effect: NoExecute
  #   key: node.kubernetes.io/not-ready
  #   operator: Exists
  #   tolerationSeconds: 300
  # - effect: NoExecute
  #   key: node.kubernetes.io/unreachable
  #   operator: Exists
  #   tolerationSeconds: 300
globalConfig:
  # one of  'dev', 'test', 'perf', 'prod'
  configurationProfile: "test"
  platformMasters: false
  ingressBaseUrl: "some-env.qvantel.solutions"
  kubernetesVersion: "1.25"
modulesConfig:
  platformCore:
    configurationRequired: "check module documentation for configuration options"
  apisixPlatformEnabled: "false"
  apisixPlatform:
    configurationRequired: "check module documentation for configuration options"
  awsPlatformEnabled: "false"
