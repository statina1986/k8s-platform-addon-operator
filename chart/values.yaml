logLevel: info
addonOperatorNamespace: "platform"
platformCore: {}
helmIgnoreRelease: "k8s-platform"
deployResources: "true"
imageBase: "platform.artifactory.qvantel.net/platform/k8s-platform-addon-operator"
deployment:
  replicas: 1
  additionalEnvironmentVars: []
  nodeSelector:
  #cluster-controller: "true"
  tolerations:
  # - effect: NoSchedule
  #   key: CriticalAddonsOnly
  #   operator: Exists
  # - effect: NoExecute
  #   key: node.kubernetes.io/not-ready
  #   operator: Exists
  #   tolerationSeconds: 300
  # - effect: NoExecute
  #   key: node.kubernetes.io/unreachable
  #   operator: Exists
  #   tolerationSeconds: 300
globalConfig:
  # one of  'dev', 'test', 'perf', 'prod'
  configurationProfile: "test"
  platformMasters: false
  antreaCNIenabled: "false"
  platformMastersKey: dedicated-nodes
  platformMastersValue: platform-masters
  localStorage: false
  localStorageKey: local-storage
  localStorageValue: "true"
  multiZone:
    enabled: false
  ingressBaseUrl: "some-env.qvantel.solutions"
  ingressBaseUrlSeparator: "-"
  appsNamespace: "qvantel"
  platformNamespace: "platform"
  operatorNamespace: ""
  kubernetesVersion: "1.25"
  containerRegistryBase: "platform.artifactory.qvantel.net/k8s-platform-1-2-0"
  helmReleaseNamePrefix: ""
  operatorHelmReleaseNamePrefix: ""
  clusterwideResources: "true"
  deployOperators: "true"
  namespaceRestricted: "false"
modulesConfig:
  apisixPlatformEnabled: "false"
  artifactoryPlatformEnabled: "false"
  awsPlatformEnabled: "false"  
  certPlatformEnabled: "false"
  cnpgPostgresPlatformEnabled: "false"
  consulPlatformEnabled: "false"
  elasticsearchPlatformEnabled: "false"
  externalDnsEnabled: "false"
  instanaPlatformEnabled: "false"
  istioIngressEnabled: "false"
  istioPlatformEnabled: "false"
  ksixPlatformEnabled: "false"
  kafkaPlatformEnabled: "false"
  kafkaPlatform:
    strimziHelmVersion: "0.43.0"
  kasopePlatformEnabled: "false"
  kyvernoPlatformEnabled: "false"
  logsearchPlatformEnabled: "false"
  lokiPlatformEnabled: "false"
  keycloakPlatformEnabled: "false"
  mariadbPlatformEnabled: "false"
  mariadbOperatorPlatformEnabled: "false"
  metallbPlatformEnabled: "false"
  metricsPlatformEnabled: "false"
  mongodbPlatformEnabled: "false"
  monitoringPlatformEnabled: "false"
  perconaPmmPlatformEnabled: "false"
  pomeriumPlatformEnabled: "false"
  postgresPlatformEnabled: "false"
  progressPlatformEnabled: "false"
  qvantelGlueEnabled: "false"
  rabbitmqPlatformEnabled: "false"
  redisPlatformEnabled: "false"
  rancherPlatformEnabled: "false"
  sftpEnabled: "false"
  sftpgoPlatformEnabled: "false"
  smartsearchPlatformEnabled: "false"
  vaultPlatformEnabled: "false"
  vaultPlatform:
    autoUnseal: false
  vectorPlatformEnabled: "false"
